[package]
name = "mace-kv"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["AbbyCin <abbytsing@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/abbycin/mace"
repository = "https://github.com/abbycin/mace"
description = "A fast, cross-platform embedded key-value storage engine with ACID, MVCC, and flash-optimized storage"
license = "MIT"
categories = ["database-implementations", "database"]
keywords = ["database", "lmdb", "sled", "rocksdb", "redis"]

[lib]
name = "mace"

[dependencies]
backtrace = "0.3.76"
crc32c = "0.6.8"
dashmap = "6.2.1"
rand = "0.10.2"
log = "0.4.33"
crossbeam-epoch = "0.9.20"
parking_lot = "0.12.5"
btree-store = "1.0.0"
rustc-hash = "2.1.3"
zstd = "0.13.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.189"

[dev-dependencies]
logger = { path = "deps/logger" }

[features]
default = []
extra_check = []
failpoints = []

[profile.release]
opt-level = 3
lto = true
debug = true
panic = "abort"
