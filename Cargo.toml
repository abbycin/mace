[package]
name = "mace-kv"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
authors = ["AbbyCin <abbytsing@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/abbycin/mace"
repository = "https://github.com/abbycin/mace"
description = "A pure-Rust lightweight alternative to RocksDB (in most cases)"
license = "MIT"
categories = ["database-implementations", "database"]
keywords = ["database", "key-value", "rocksdb", "leveldb", "sled"]

[workspace]
members = ["cli"]
exclude = ["fuzz"]
resolver = "3"

[lib]
name = "mace"

[dependencies]
backtrace = "0.3.77"
crc32c = "0.6.9"
dashmap = "6.2.1"
rand = "0.10.3"
crossbeam-epoch = "0.9.21"
parking_lot = "0.13.0"
btree-store = "2.1.0"
rustc-hash = "2.1.3"
zstd = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.191"

[features]
metrics = []
extra_check = ["metrics"]
failpoints = ["extra_check"]
# internal on-disk inspection surface for the exact-pinned maintenance CLI;
# not part of the stable public API
maintenance = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
debug = 1
incremental = false

[[example]]
name = "observer"
required-features = ["metrics"]
