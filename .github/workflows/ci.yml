name: Cross-platform CI

on:
  push:
    branches: [ master, tmp ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Linux, Windows, macOS (x86_64 and ARM64)
  test-mainstream:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest # Apple Silicon ARM64
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p mace-kv --verbose

      - name: Build maintenance CLI
        run: cargo build -p mace-kv-cli --bin mace-kv --verbose

      - name: Run Tests
        run: cargo test -p mace-kv -p mace-kv-cli --features extra_check --verbose -- --nocapture

  test-prod-all:
    name: Prod Test Flow (all) (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify runner arch is x86_64
        run: |
          test "$(uname -m)" = "x86_64"

      - name: Run prod all suite
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        env:
          FEATURES: failpoints
          FAST_TIMEOUT: "300"
          STRESS_TIMEOUT: "600"
          CHAOS_TIMEOUT: "300"
          CHAOS_RETRY: "1"
          MACE_PROD_BUCKET_STRESS_ROUNDS: "512"
          MACE_PROD_BUCKET_CHURN_ROUNDS: "128"
          MACE_PROD_BUCKET_CHURN_WORKERS: "2"
          MACE_PROD_EVICTOR_STRESS_ROUNDS: "512"
        run: bash ./scripts/prod_test.sh all 8

  # Job 2: FreeBSD (Runs in a VM on top of Linux)
  test-freebsd:
    name: FreeBSD (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run tests in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo test -p mace-kv -p mace-kv-cli --features extra_check --verbose -- --nocapture

  # Job 3: Linux ARM64
  test-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p mace-kv -p mace-kv-cli --verbose

      - name: Run tests
        run: cargo test -p mace-kv -p mace-kv-cli --features extra_check --verbose -- --nocapture
