  - id: protocol.global_options_presence_and_compatibility_gate
    title: initialized manifests must carry global options and pass the immutable reopen gate before recovery
    kind: protocol
    status: active
    confidence: high
    statement: >
      A manifest becomes initialized only after `current_version` and `BUCKET_MISC/options` are
      durably published together. Once a manifest is treated as initialized, `BUCKET_MISC/options`
      must exist and decode as `PersistedOptions`. Reopen must reject missing or malformed records
      as corruption and must reject immutable global-option mismatches, currently `concurrent_write`,
      before recovery starts. A visible but otherwise pristine manifest file that still lacks both
      records must bootstrap them instead of being treated as corruption. Mutable persisted fields
      follow the current open call's normalized `Options`; if the persisted subset changes, the
      manifest must be rewritten before recovery begins.
    watch_points:
      - path: src/utils/options.rs
        note: persisted options schema, defaults, json decode, and immutable compatibility checks live here
      - path: src/meta/manifest.rs
        note: manifest bootstrap and BUCKET_MISC/options read-write helpers live here
      - path: src/meta/builder.rs
        note: open-time persisted options load and compatibility gate live here
      - path: src/store/store.rs
        note: options writeback is sequenced before recovery here
      - path: tests/bucket.rs
        note: manifest misc/options regressions and immutable mismatch reopens live here
    witnesses:
      - path: src/meta/manifest.rs
        note: manifest helpers publish current_version and options together and distinguish pristine bootstrap from initialized corruption here
      - path: src/meta/builder.rs
        note: load bootstraps only pristine manifests and otherwise rejects missing or incompatible persisted options before bucket metadata and recovery proceed
      - path: src/store/store.rs
        note: Mace::new probes manifest state through FileSystem and writes updated mutable persisted options before Recovery::phase1 starts
      - path: tests/bucket.rs
        note: bootstrap, visible-but-uninitialized bootstrap, mutable rewrite, missing key, bad json, and concurrent_write conflict reopens are asserted here
    failure_symptoms:
      - a crash after manifest file creation but before version/options bootstrap permanently bricks an otherwise empty database root
      - "reopen succeeds even though an initialized manifest lacks `BUCKET_MISC/options`"
      - malformed options json is treated as absence or silently rebuilt
      - "`concurrent_write` changes across reopens and recovery still starts"
      - mutable global-option changes are visible in memory for the current open but missing from the next manifest read
    verifiers:
      - type: unit-test
        path: src/utils/options.rs
        note: persisted options tests cover defaults, unknown fields, and concurrent_write conflict detection
      - type: regression-test
        path: tests/bucket.rs
        note: global_options_* tests validate bootstrap writeback, visible-but-uninitialized bootstrap, mutable rewrites, corruption cases, and immutable mismatch rejection
      - type: runtime-order
        path: src/store/store.rs
        note: Mace::new writes persisted options before Recovery::phase1

  - id: protocol.foreground_admission_before_tree_update
    title: foreground admission wait must happen before entering tree.update mutation paths
    kind: protocol
    status: active
    confidence: high
    statement: >
      Foreground write admission and any backpressure wait must occur before the writer enters the
      `tree.update` critical mutation path. The permit reserves dirty-memory budget and the write path
      must not bypass it when backpressure is enabled.
    watch_points:
      - path: src/index/txn.rs
        note: transaction write paths obtain foreground permits before tree.update here
      - path: src/map/flow.rs
        note: FlowController and ForegroundWritePermit semantics live here
      - path: src/map/buffer.rs
        note: before_foreground_write bridges bucket pool and flow controller here
      - path: tests/backpressure.rs
        note: metrics-based behavior coverage lives here
    witnesses:
      - path: src/index/txn.rs
        note: before_write_budget obtains ForegroundWritePermit before update mutation calls
      - path: src/map/flow.rs
        note: acquire_foreground_permit blocks and accounts wait before granting mutation entry
      - path: tests/backpressure.rs
        note: observe metrics prove admission waiting occurred under pressure
    failure_symptoms:
      - writers enter mutation without dirty-budget reservation
      - backpressure metrics stay zero while memory pressure should block foreground writes
      - mutation path amplifies dirty memory because waiting happened too late
    verifiers:
      - type: regression-test
        path: tests/backpressure.rs
        note: write_backpressure_emits_observe_metrics verifies blocking and metrics emission
      - type: runtime-order
        path: src/index/txn.rs
        note: write paths call before_write_budget before tree.update

  - id: dependency.manifest_conditional_update_semantics
    title: manifest stat apply depends on btree-store conditional update and atomic multi-bucket commit
    kind: dependency
    status: suspect
    confidence: medium
    statement: >
      Manifest commit currently assumes the metadata backend provides an atomic commit across
      multiple buckets and an update operation that returns false on a missing key instead of
      silently inserting. Mace relies on that contract when applying persisted stat updates,
      recording miss metrics, and publishing map, frontier, Sequences, and stats inside one
      manifest transaction boundary.
    watch_points:
      - path: Cargo.toml
        note: btree-store version and feature changes can invalidate this contract
      - path: src/meta/manifest.rs
        note: Manifest is directly bound to BTree::open and btree-backed buckets
      - path: src/meta/txn.rs
        note: exec_multi commit path and MetaOp::Update handling encode the dependency
      - path: src/store/store.rs
        note: flush publish relies on one manifest transaction for stats, map, frontier, and Sequences
      - path: tests/prod_recovery_failpoints.rs
        note: crash windows around manifest commit are the closest existing behavioral evidence
    witnesses:
      - path: src/meta/txn.rs
        note: MetaOp::Update interprets tree_txn.update returning false as a miss rather than an insert
      - path: src/meta/txn.rs
        note: exec_multi is treated as one atomic manifest commit across buckets
      - path: src/store/store.rs
        note: publish relies on the manifest transaction to keep map, frontier, stats, and Sequences aligned
    failure_symptoms:
      - stat rows are silently inserted, skipped, or drift from intended conditional update behavior
      - multi-bucket publish becomes partially visible across stats, map, frontier, or Sequences
      - recovery or GC observes metadata that crossed an invalid durability boundary
      - upgrading btree-store changes semantics without any local compile error
    verifiers:
      - type: failpoint-partial
        path: tests/prod_recovery_failpoints.rs
        note: manifest_before_multi_commit exercises atomicity under crash timing, but not the full contract
      - type: evidence-gap
        path: src/meta/txn.rs
        note: there is no dedicated contract test today for update-on-miss or exec_multi semantics
    next_actions:
      - add a narrow contract test that proves update-on-miss returns false without inserting
      - add a meta-store adapter boundary so dependency semantics are audited in one place
