        path: tests/prod_recovery_failpoints.rs
        note: recovery wal recycle done window tests validate intent and done durability across crash windows
      - type: runtime-order
        path: src/meta/manifest.rs
        note: recycle state is stored and loaded from Sequences as explicit durable state
      - type: unit-test
