  - id: protocol.collector_start_waits_for_recovery_waterline
    title: the collector must not run before recovery establishes the oracle/safe waterline
    kind: protocol
    status: active
    confidence: high
    statement: >
      The collector thread must not start before recovery phase2 has stored the
      recovered oracle and published the initial safe_exclusive waterline
      (init_safe_exclusive). A collector running during recovery can read a
      pre-recovery oracle cut while init_safe_exclusive raises safe_exclusive,
      so candidate is below published_safe and the monotonicity assert fails;
      the same race can regress safe_exclusive if the collector stores a
      pre-recovery candidate after recovery raised it. Context::new therefore
      only keeps the receiver; Context::start (called after phase2) spawns the
      collector. init_safe_exclusive must raise safe_exclusive monotonically
      (fetch_max), never regress a boundary a collector round may already have
      published.
    watch_points:
      - path: src/cc/context.rs
        note: Context::new keeps the receiver without spawning; Context::start spawns the collector and enables checkpointing; init_safe_exclusive uses fetch_max
      - path: src/store/store.rs
        note: Mace::new runs recovery phase2 before store.start, which drives Context::start
    witnesses:
      - path: src/cc/context.rs
        note: Context::new stores the receiver in collector_rx and leaves collector None; Context::start takes the receiver, spawns collect_thread, then enables per-group checkpoint recording
      - path: src/cc/context.rs
        note: init_safe_exclusive uses fetch_max(recovered_oracle, AcqRel) so recovery can only raise the waterline
      - path: src/cc/context.rs
        note: quit_waits_for_inflight_then_joins_collector calls start() first so the join path is actually exercised
    failure_symptoms:
      - collector panics on candidate >= published_safe during or right after open (fuzz crash_reopen artifact, 2026-08)
      - safe_exclusive regresses below a value a collector round published during recovery
    verifiers:
      - type: runtime-order
        path: src/store/store.rs
        note: phase2 (recovery) runs before store.start to Context::start (collector spawn)
      - type: regression-test
        path: src/cc/context.rs
