schema_version: 1

policy:
  summary: >
    Live constraint ledger for Mace. Entries here must stand on their own instead of
    pointing back to source documents as the primary carrier of the rule.
  source_split:
    design_md: stable architecture and protocol explanation
    registry_yaml: executable live constraint ledger
    retired_md: intentionally removed constraints with retirement reason
  status_meaning:
    draft: observed or inferred but not yet strong enough to rely on
    active: currently relied on and backed by at least one meaningful verifier
    suspect: likely real but must be re-reviewed because evidence is weak, stale, or a watch point changed
    retired: no longer intended to hold and should be moved to retired.md
  kind_meaning:
    local: closed inside one module or data structure
    protocol: spans a bounded sequence of steps or lifecycle phases
    emergent: holds only because several code paths preserve it together
    dependency: depends on upstream or external contract semantics
  minimum_fields:
    - id
    - title
    - kind
    - status
    - statement
    - watch_points
    - witnesses
    - failure_symptoms
    - verifiers

entries:
  - id: protocol.flush_publish_data_first_meta_last
    title: persisted data and blob payloads must become durable before metadata points to them
    kind: protocol
    status: active
    confidence: high
    statement: >
      Any data or blob file that becomes reachable through manifest metadata must be fully written
      and synced before the manifest transaction publishes intervals, stats, map, frontier, or
      `Sequences` metadata that references it. Metadata must never point to non-durable payload files.
    watch_points:
      - path: src/map/flush.rs
        note: file build and stage-orphan sequencing starts here
      - path: src/io/mod.rs
        note: filesystem boundary dispatch for runtime data/blob file opens lives here
      - path: src/io/unix.rs
        note: unix open flag mapping for runtime data/blob/wal files lives here
      - path: src/io/win.rs
        note: windows open flag mapping for runtime data/blob/wal files lives here
      - path: src/utils/options.rs
        note: explicit data/log directory sync helpers used by durability closure live here
      - path: src/store/store.rs
        note: publish ordering between file sync and manifest txn is enforced here
      - path: src/meta/manifest.rs
        note: manifest records orphan markers and metadata publish state here
      - path: src/store/gc.rs
        note: rewrite path follows the same durability ordering for replacement files
    witnesses:
      - path: src/map/flush.rs
        note: staged orphan marker and file build sequence precede metadata publish handoff
      - path: src/store/store.rs
        note: sync built writers before beginning the manifest transaction
      - path: src/store/gc.rs
        note: multi-output rewrite stages every orphan marker, syncs all replacement files, then clears every marker in one metadata publish
    failure_symptoms:
      - reopen or recovery sees metadata pointing to a file that is missing or truncated
      - crash window leaves a published interval whose payload file is not durable
      - data or blob reads fail after restart despite metadata claiming the file exists
    verifiers:
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: data and blob rewrite crash windows cover marker staging, all-output directory sync, and metadata commit; the data marker case aborts on the second output
      - type: regression-test
        path: tests/prod_gc.rs
        note: oversized_data_rewrite_splits_outputs_and_reopens and oversized_blob_rewrite_splits_outputs_and_reopens verify multi-output publish and reopen visibility
      - type: runtime-order
        path: src/store/store.rs
        note: publish flow orders sync before manifest commit in code

  - id: wal_position_epoch_monotonic_across_route_switch
    title: every route-switch or layout-migration reopen starts the new era at a globally monotonic file-id epoch; same-route matched-layout reopens continue in-stream
    kind: protocol
    status: active
    confidence: high
    statement: >
      A route-switch reopen (requested sync_on_write differs from the persisted
      last-completed route) or a same-route physical layout migration (a durable open
      finds legacy per-group wal_<group>_<seq> files, which the durable steady state never
      writes) computes the global file-id high water H over all wal_* files, persisted
      bucket frontiers, and wal recycle states, ensures the old wal is fully recyclable
      (graceful-exit checkpoint, or a forced full-fsync checkpoint of the recovery-redone
      tail on a crash exit), deletes every old wal file via the two-phase recycle protocol —
      shared stream first, legacy per-group streams last, so a mixed namespace can never
      enter steady state — and starts the new era at H+1 (0 for a clean database). The
      previous era's WAL files are never appended. A same-route reopen with a matched
      layout skips the epoch entirely and continues each active stream in its existing
      latest file; the retained scan of a stream starts at its durable done boundary, and
      the wipe advances every physical stream's done state to the new era start (including
      streams with no files at the wipe time), so when files exist the done boundary always
      equals the oldest present file and a real missing file at or above it is a detectable
      gap. Wipe deletion enumerates only actual namespace entries inside the intent range rather
      than probing every numeric id up to H; the intent/done boundary still advances to H+1.
      A shared stream with no files at boot starts at the greater of its durable done boundary
      and one plus the largest persisted bucket-frontier file id (with zero as the implementation
      seed when no frontier exists), so fresh records can never land at or below any bucket
      frontier. Recycle intent from-file-ids are clamped by the persisted done boundary
      (from = max(intent.from, state.oldest_id())), so a stale in-memory oldest_wal_id lagging
      behind a completed wipe can never regress the boundary.
      A real missing file inside a stream range or an H+1 overflow is OpCode::Corruption.
    watch_points:
      - path: src/store/recovery.rs
        note: phase1 computes H/start and detects the rebuild; phase2 forces the checkpoint and wipes the old wal; epoch_high_water computes H; evict_bucket forces full-fsync eviction flushes under a pending rebuild; wipe_old_wal advances every stream's done state; load_physical_stream_boot scans from the done boundary
      - path: src/meta/manifest.rs
        note: options writeback timing (after switch processing) carries the persisted route signal
      - path: src/store/store.rs
        note: Mace::new detects route_switch and legacy per-group layout files (has_legacy_per_group_wal) and writes back the current options after recovery
      - path: src/map/buffer.rs
        note: BucketMgr::del_bucket(force_fsync) and BucketContext::checkpoint_and_wait(force) implement the full-fsync tail flush the wipe depends on
      - path: src/store/gc.rs
        note: drain_abort_clean_during_recovery(force_fsync) and stabilize_cleaned_pages force-fsync the scrub of drain-loaded buckets before the wipe
      - path: src/index/tree.rs
        note: recovery-created roots carry Position::MIN (Context::recovering), so recovery flushes only advance the frontier to materialized records
      - path: src/cc/context.rs
        note: Context::recovering gates the recovery-root lsn until phase2 completes every root-creating or root-flushing recovery action
      - path: tests/epoch_route.rs
        note: route switch and gap rejection coverage lives here
      - path: tests/layout_migration.rs
        note: same-route migration includes a true two-stream legacy fixture, malformed legacy WAL behavior, monotonic new ids, and mixed-namespace coverage
      - path: tests/prod_generation_failpoints.rs
        note: route-switch and same-route layout-migration recycle crash windows live here
    witnesses:
      - path: src/store/recovery.rs
        note: wipe_old_wal deletes [oldest, start) per stream via two-phase recycle in shared-first/legacy-last order; seed_checkpoint_floors runs on every open; same-route matched-layout opens keep start_id = latest_id; recovery evictions under a pending rebuild flush full-fsync (del_bucket force) and recovery-created tree roots carry Position::MIN (Context::recovering), so the frontier only advances to materialized records; load_physical_stream_boot starts a file-less shared stream at max(oldest, max frontier file id with zero seed + 1)
      - path: src/meta/manifest.rs
        note: commit_wal_recycle_intent clamps intent.from by the persisted oldest (done) boundary, so a stale in-memory oldest cannot regress recycle safety
      - path: src/cc/log.rs
        note: advance_oldest_wal_id only moves forward and only after a completed recycle round
      - path: src/store/store.rs
        note: has_legacy_per_group_wal triggers layout migration on durable opens that find wal_<group>_<seq> files
      - path: src/index/tree.rs
        note: Tree::init stamps recovery roots with Position::MIN and runtime roots with the current append position
      - path: src/cc/context.rs
        note: Context::recovering gates the recovery-root lsn; init_safe_exclusive clears it only after phase2 completes forced checkpoint/eviction, wipe, and recovery floor publication
      - path: tests/epoch_route.rs
        note: route_switch_starts_new_era_at_higher_contiguous_file_ids and group_wal_gap_rejected_on_reopen cover the ordering
      - path: tests/layout_migration.rs
        note: true_multi_group_legacy_wal_is_recovered_and_migrated proves real wal_0/wal_1 redo and H+1 ordering; malformed_true_legacy_wal_obeys_truncation_option_during_migration covers strict and truncating corruption handling; rename and mixed-namespace tests retain compatibility coverage
      - path: tests/prod_generation_failpoints.rs
        note: route-switch tests cover cross-route windows; layout_migration_crash_* covers remove-before-dir-sync, final-stream done, and route-writeback windows for same-route migration
    failure_symptoms:
      - a route-switch or layout-migration reopen appends to the previous era's last WAL file or leaves old files behind
      - recovery compares positions across physical streams without a monotonic file-id order
      - a missing file inside a stream range is silently skipped instead of Corruption
      - a mid-wipe crash leaves a pending recycle intent that the next boot does not complete
      - legacy wal_<group>_<seq> files survive a durable same-route reopen forever
    verifiers:
      - type: regression-test
        path: tests/epoch_route.rs
        note: route switch, higher contiguous era, and real-gap tests
      - type: regression-test
        path: tests/layout_migration.rs
        note: true multi-group, malformed-tail, monotonic epoch, graceful, crash-recovery, and mixed-namespace migrations wipe legacy streams and continue on the shared namespace
      - type: failpoint-test
        path: tests/prod_generation_failpoints.rs
        note: route-switch matrix plus layout_migration_crash_* intent/delete/done/final-writeback windows; these tests need both failpoints and extra_check and run as a dedicated prod_test.sh fast/all target with a non-zero test-count guard

  - id: durable_generation_sync_covers_all_sealed_writers
    title: only a generation leader syncs, and it syncs every writer sealed by its cut
    kind: protocol
    status: active
    confidence: high
    statement: >
      In the durable route, advance, ring overflow, auto-stable flush, large-record
      append, and the checkpoint hint are flush-only and never advance durable_pos.
      A generation leader must sync every writer detached by rotation before its
      sealed cut plus the current writer and the log directory, and advance
      durable_pos to the sealed cut only after success; the wal sync counter
      increments only when a leader attempts a physical sync round.
    watch_points:
      - path: src/cc/log.rs
        note: leader_seal_sync_and_complete, try_sync_generation_files, and the flush-only paths live here
      - path: src/index/txn.rs
        note: durable commit and abort route through the generation protocol
      - path: src/cc/context.rs
        note: drive_sync and the merge window orchestrate the leader round
      - path: src/store/gc.rs
        note: the durable recycle boundary holds the shared logging lock, matching the generation critical section
    witnesses:
      - path: src/cc/log.rs
        note: try_sync_generation_files syncs pending rotation writers, the current writer, and the dir; non-generation paths only flush
      - path: tests/generation.rs
        note: rotation_writers_are_synced_by_generation_and_survive_reopen asserts WalSync == WalGeneration under rotation
    failure_symptoms:
      - advance, large-record, or checkpoint append triggers a private fsync
      - a rotation-detached writer is never synced and data is lost on crash
      - durable_pos advances without a successful sealed-cut sync
    verifiers:
      - type: regression-test
        path: tests/generation.rs
        note: rotation_writers_are_synced_by_generation_and_survive_reopen
      - type: regression-test
        path: tests/wal_route.rs
        note: durable_large_record_commit_performs_single_wal_sync and durable_large_record_across_rotation_survives_reopen
      - type: failpoint-test
        path: tests/prod_generation_failpoints.rs
        note: generation and rotation crash windows; gated by the prod_test.sh failpoints+extra_check target (non-zero test-count guard)

  - id: wal_recovery_truncates_at_first_malformed_record
    title: recovery truncates each physical stream at the first malformed record start
    kind: protocol
    status: active
    confidence: high
    statement: >
      Recovery validates records per physical stream in order (header, length,
      payload, checksum). At the first malformed or incomplete record the scan
      stops at that record's start; with truncate_corrupted_wal enabled the file
      is truncated there and later files of the stream are not scanned; otherwise
      OpCode::Corruption is returned. There is no persisted fsync watermark and
      runtime durable_pos is not a truncation boundary. When truncation occurs
      after an active writer was opened, recovery must rebase that writer's
      runtime positions to the truncated physical EOF before any checkpoint,
      cleanup, or foreground append can use them.
    watch_points:
      - path: src/store/recovery.rs
        note: analyze truncate-or-corruption decision and stop-scan semantics live here
      - path: src/cc/log.rs
        note: generation seal crash windows can leave flushed but unsynced tails; logger position rebasing keeps an already-open writer aligned after recovery truncation
      - path: src/cc/context.rs
        note: recovery rebases each active physical logger once after analyze and abort-clean complete
      - path: tests/prod_generation_failpoints.rs
        note: torn-tail crash window lives here
    witnesses:
      - path: src/store/recovery.rs
        note: analyze stops at start_pos of the first bad record, truncates when enabled, breaks out of the file scan, then rebases active logger positions before runtime work
      - path: src/store/recovery.rs
        note: unit tests cover invalid subtype, oversized header, and invalid entry type
      - path: tests/prod_generation_failpoints.rs
        note: wal_tail_corruption_truncates_at_first_bad_record asserts truncation, discard of later records, post-truncation append position, and second-reopen visibility
    failure_symptoms:
      - recovery scans past the first malformed record into later records or files
      - truncation uses a non-persisted sync watermark instead of the bad record start
      - a torn tail triggers Corruption even when truncate_corrupted_wal is enabled
      - a post-truncation append uses stale pre-truncation positions and makes checkpoint, recovery, or abort-clean address bytes beyond the physical EOF
    verifiers:
      - type: unit-test
        path: src/store/recovery.rs
        note: invalid_entry_type_is_truncated_when_enabled, invalid_entry_type_returns_corruption_when_truncate_disabled, oversized_update_header_is_truncated_when_enabled
      - type: failpoint-test
        path: tests/prod_generation_failpoints.rs
        note: wal_tail_corruption_truncates_at_first_bad_record (post-truncation append/checkpoint/reopen) and truncated_tail_runtime_abort_clean_completes_and_unpins (runtime abort-clean chain and wal-pin release after truncation); both gated by the prod_test.sh failpoints+extra_check target (non-zero test-count guard)

  - id: relaxed_commit_bypasses_sync_coordination
    title: relaxed commits never touch generation state
    kind: protocol
    status: active
    confidence: high
    statement: >
      With sync_on_write=false, a commit only flushes its records to the
      file/page cache and publishes the fact; it never registers a generation,
      elects a leader, waits on a completion, or increments the wal sync counter.
      Relaxed mode never creates a writable logger beyond each logical group's
      own stream.
    watch_points:
      - path: src/index/txn.rs
        note: relaxed commit and abort keep the flush-only sync(false) path
      - path: src/cc/log.rs
        note: register_sync and barrier_register assert they are only used in the durable route
      - path: src/cc/context.rs
        note: drive_sync and the merge window are durable-route only
    witnesses:
      - path: src/index/txn.rs
        note: relaxed commit calls log.sync(false) (flush only) and never register_sync
      - path: tests/generation.rs
        note: relaxed_commits_never_touch_generation_state asserts zero generations and zero wal syncs for relaxed commits
    failure_symptoms:
      - a relaxed commit triggers a generation registration or a wal sync
      - relaxed mode creates a shared writable logger
      - generation counters become nonzero under a relaxed workload
    verifiers:
      - type: regression-test
        path: tests/generation.rs
        note: relaxed_commits_never_touch_generation_state

  - id: durable_fact_waits_for_shared_wal_cut
    title: modified commit publishes its fact only after the shared wal cut covers its target
    kind: protocol
    status: active
    confidence: high
    statement: >
      A modified transaction's commit fact becomes Committed only after the
      generation sealing a cut >= the commit record's target completes
      successfully; every successful ticket observes durable_pos >= target. A
      failed generation broadcasts the same error to all participants and no
      fact is published. An orphaned generation (leader ticket dropped before
      complete) is failed with the error and the sync state is reset, so no
      waiter hangs and no fact is published for it.
    watch_points:
      - path: src/index/txn.rs
        note: commit registers the target and publishes the fact after drive_sync
      - path: src/cc/log.rs
        note: leader_seal_sync_and_complete advances durable_pos to the sealed cut only on success
      - path: src/cc/context.rs
        note: drive_sync re-checks durable_pos >= target under extra_check
      - path: tests/si.rs
        note: durable commit cut witnesses live here
    witnesses:
      - path: src/index/txn.rs
        note: commit_fact runs only after drive_sync returns Ok
      - path: src/cc/log.rs
        note: SyncTicket::drop publishes Err(IoError) for an orphaned unpublished leader generation, resets the phase, and notifies all waiters; extra_check re-checks durable_pos against both the ticket target and the sealed cut
      - path: tests/si.rs
        note: durable_commit_publishes_fact_only_after_wal_cut_is_durable
      - path: tests/generation.rs
        note: generation_sync_failure_broadcasts_and_isolates_next_generation proves no fact on sync failure; orphaned_leader_generation_is_reset_on_ticket_drop covers the drop guard
    failure_symptoms:
      - a commit returns success while durable_pos is below its target
      - a failed generation still publishes a committed fact
      - a follower receives a different result than the leader for the same generation
    verifiers:
      - type: regression-test
        path: tests/si.rs
        note: durable_commit_publishes_fact_only_after_wal_cut_is_durable
      - type: regression-test
        path: tests/generation.rs
        note: generation_sync_failure_broadcasts_and_isolates_next_generation
  - id: protocol.orphan_marker_is_only_cleanup_source
    title: orphan files are cleaned only through explicit Sequences markers
    kind: protocol
    status: active
    confidence: high
    statement: >
      Startup orphan cleanup must rely only on explicit `odf_*` and `obf_*` entries in the
      Sequences metadata bucket.
      Recovery must not scan directories heuristically or infer orphan ranges from max file ids.
      Marker clear failure is fatal because markers are the durable source of truth for orphan cleanup.
    watch_points:
      - path: src/meta/builder.rs
        note: startup orphan cleanup and marker clear happen here
      - path: src/meta/manifest.rs
        note: orphan stage and clear operations are defined here
      - path: src/io/mod.rs
        note: marker-driven cleanup now relies on centralized try_exists/remove_file semantics here
      - path: src/map/flush.rs
        note: flush stages orphan files here
      - path: src/store/gc.rs
        note: rewrite stages and clears orphan markers here
    witnesses:
      - path: src/meta/builder.rs
        note: clean_orphans iterates Sequences markers and forbids max-id probing or directory scans
      - path: src/meta/manifest.rs
        note: stage_orphan_file and clear_orphan_file are the manifest-side carrier of the protocol
      - path: src/store/gc.rs
        note: each multi-output rewrite stages one marker per replacement file and clears all markers in its single publish transaction
    failure_symptoms:
      - orphan files remain after recovery despite marker-driven cleanup
      - recovery deletes non-orphan files because cleanup became heuristic
      - orphan marker update panic or crash leaves startup in an unrecoverable state
    verifiers:
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: rewrite crash windows validate marker-driven cleanup across staged multi-output data and blob replacements; the data marker case reaches the second output
      - type: runtime-assert
        path: src/meta/builder.rs
        note: orphan marker update failure panics instead of silently weakening the protocol

  - id: protocol.interval_map_non_overlap
    title: live interval metadata must remain non-overlapping
    kind: local
    status: active
    confidence: high
    statement: >
      Each inserted data or blob interval must preserve the non-overlap invariant within the
      corresponding `IntervalMap`. Recovery may upsert the same interval key to a new file id, but
      live interval insertion must not create overlapping ranges.
    watch_points:
      - path: src/utils/interval.rs
        note: IntervalMap insert and recovery upsert semantics live here
      - path: src/meta/manifest.rs
        note: interval recovery and in-memory stat interval updates route through this logic
      - path: src/store/store.rs
        note: flush publish inserts new intervals here
      - path: src/store/gc.rs
        note: rewrite/remap intervals are produced here
    witnesses:
      - path: src/utils/interval.rs
        note: extra_check asserts reject overlap on insert and constrain upsert to recovery semantics
      - path: src/store/store.rs
        note: publish path records interval metadata and updates in-memory interval state together
      - path: src/store/gc.rs
        note: split rewrite deletes every source interval, then inserts sorted non-overlapping output sub-intervals with new lower bounds
    failure_symptoms:
      - interval lookups resolve the wrong file id for a logical address
      - overlap panic under extra_check
      - GC or read path hits inconsistent interval ownership for one address
    verifiers:
      - type: unit-test
        path: src/utils/interval.rs
        note: moha and merge_split cover overlap rejection and find behavior
      - type: runtime-assert
        path: src/utils/interval.rs
        note: insert asserts no overlap under extra_check
      - type: regression-test
        path: tests/prod_gc.rs
        note: oversized data and blob rewrites replace one old interval set with multiple outputs and verify reads after reopen

  - id: protocol.reloc_completeness_for_mapped_addrs
    title: every mapped address in a published flush batch must resolve through reloc metadata
    kind: protocol
    status: active
    confidence: high
    statement: >
      For any logical address exposed by the published map and interval metadata for a flush batch,
      relocation lookup must succeed. `ivl_map.find(addr)` and reloc lookup must jointly remain valid
      for all mapped addresses in that durable batch.
    watch_points:
      - path: src/map/data.rs
        note: file builder emits interval and reloc metadata here
      - path: src/io/mod.rs
        note: filesystem boundary dispatch for stat and data/blob reader opens lives here
      - path: src/io/unix.rs
        note: unix read/open flag mapping for stat and data/blob readers lives here
      - path: src/io/win.rs
        note: windows read/open flag mapping for stat and data/blob readers lives here
      - path: src/meta/stat.rs
        note: junk/stat apply depends on reloc lookup remaining valid here
      - path: src/store/gc.rs
        note: rewrite builder rebuilds reloc and interval metadata here
      - path: src/store/store.rs
        note: publish path records intervals and stats in one metadata boundary
    witnesses:
      - path: src/map/data.rs
        note: flush file tests assert reloc entries exist for flushed addresses
      - path: src/meta/stat.rs
        note: stat apply uses interval lookup plus reloc lookup as the read-side correctness assumption
      - path: src/store/gc.rs
        note: split rewrite rebuilds one unique reloc target per active address and writes address-sorted output interval metadata
    failure_symptoms:
      - can't find addr in reloc panic during reopen, recovery, or GC
      - stat apply or read path observes an interval hit with no matching reloc entry
      - persisted file metadata passes interval lookup but cannot locate payload offset
    verifiers:
      - type: unit-test
        path: src/map/data.rs
        note: flush metadata test asserts interval and reloc completeness for flushed addrs
      - type: runtime-assert
        path: src/meta/stat.rs
        note: read/stat paths panic when reloc completeness is violated
      - type: regression-test
        path: tests/prod_gc.rs
        note: oversized data and blob multi-output rewrites reopen and read every updated and untouched record through the new interval and reloc metadata

  - id: emergent.checkpoint_live_set_only
    title: checkpoint snapshot must flush only the current live dirty set
    kind: emergent
    status: active
    confidence: high
    statement: >
      Checkpoint snapshot may flush only pages reachable from the dirty-root live graph that are not
      already durable. For `addr > snap_addr`, disappearing from both sealed and hot generations is an
      invariant violation. Carry-over of live pages must move page bytes and retired lineage together.
    watch_points:
      - path: src/map/buffer.rs
        note: epoch cut and root/inflight rotation decide the snapshot boundary here
      - path: src/map/data.rs
        note: snapshot traversal, carry-over, and live-set assertions live here
      - path: src/map/publish.rs
        note: replace and evict feed dirty roots and retired lineage into checkpoint closure
    witnesses:
      - path: src/map/buffer.rs
        note: checkpoint atomically rotates hot and sealed generations in one critical section
      - path: src/map/data.rs
        note: snapshot waits inflight writers to zero and asserts live addrs above snap_addr do not disappear
      - path: src/map/data.rs
        note: carry_over_addrs republishes page bytes and retired lineage under one boundary
    failure_symptoms:
      - live page above `snap_addr` disappears from dirty generations before becoming durable
      - checkpoint flushes stale or unreachable pages as if they were live
      - readers observe a page as neither hot nor sealed during churn
    verifiers:
      - type: runtime-assert
        path: src/map/data.rs
        note: extra_check asserts on disappearing live addrs above snap_addr
      - type: runtime-order
        path: src/map/buffer.rs
        note: epoch cut keeps root/inflight rotation atomic in code

  - id: protocol.checkpoint_epoch_cut_atomicity
    title: checkpoint epoch cut must atomically rotate writable and sealed generations
    kind: protocol
    status: active
    confidence: high
    statement: >
      Starting a checkpoint must atomically swap hot generations, publish sealed generations, and
      rotate writer root and inflight slots under one cut. Writers must not straddle that cut, and
      sealed generations must be uniquely owned before checkpoint finish recycles them.
    watch_points:
      - path: src/map/buffer.rs
        note: checkpoint cut, gate locking, and fresh checkpoint barrier live here
      - path: src/map/data.rs
        note: finish path requires unique ownership before recycling sealed generations
    witnesses:
      - path: src/map/buffer.rs
        note: checkpoint uses epochs.gate write lock and one critical section to rotate page/root/inflight state
      - path: src/map/data.rs
        note: sealed generation recycle uses Arc::try_unwrap and waits inflight zero first
    failure_symptoms:
      - writer mutations straddle the cut and become visible in both epochs
      - checkpoint finish panics because sealed generations are still shared
      - dirty roots or inflight state leak across checkpoint boundaries
    verifiers:
      - type: runtime-assert
        path: src/map/data.rs
        note: sealed generation uniqueness is asserted with Arc::try_unwrap
      - type: runtime-order
        path: src/map/buffer.rs
        note: gate plus root/inflight rotation enforce the protocol in code

