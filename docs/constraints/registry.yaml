  - id: protocol.graceful_exit_flushes_all_dirty_pages
    title: graceful exit must flush every dirty page with a full fsync
    kind: protocol
    status: active
    confidence: high
    statement: >
      A graceful close (last handle drop) must persist every live dirty page
      into the data/blob files written by the final checkpoint with a full
      fsync before that checkpoint's manifest publish, regardless of
      sync_on_write. The exit path must drain every pending abort-clean task
      (recovery-style) before the final checkpoint so a clean close leaves no
      aborted bytes in the data files; the drain itself may dirty pages, and
      those pages are included in the subsequent final checkpoint. Recovery
      also redoes abort-clean from the wal on every open (old wal is wiped only
      after the recovery abort-clean drain, and wal recycle honors pending
      abort-clean pins). Run-time
      relaxed checkpoints keep the fdatasync-only contract; only the exit path
      forces fsync, so the relaxed runtime guarantee (page-cache writes remain
      valid) is untouched. Failure or abort paths (Store::abort, reclaim
      fallback) are not covered: they keep the fdatasync-only flush and may
      leave aborted versions behind (invisible, recovered on next open).
    watch_points:
      - path: src/map/buffer.rs
        note: BucketMgr::quit drives checkpoint_before_reclaim(true) per bucket before the flusher stops
      - path: src/map/flush.rs
        note: FlushResult::sync picks fsync when force_fsync is set (exit-path tasks only)
      - path: src/store/store.rs
        note: quit order drains in-flight transactions, then final checkpoints, then WAL barrier
    witnesses:
      - path: src/map/flush.rs
        note: FlushResult::sync applies force_fsync only to exit-path tasks; run-time checkpoints stay fdatasync
      - path: src/map/buffer.rs
        note: only BucketMgr::quit passes true; every run-time trigger passes false
      - path: tests/exit_flush.rs
        note: deleting every WAL file of both namespaces (per-group wal_<group>_<seq> and shared group_wal_<seq>) after a graceful exit still exposes the full committed set, durable and relaxed (WAL-independent recovery; same-process page cache cannot distinguish fsync from fdatasync, so this test pins the flush-all + manifest-publish half of the rule)
    failure_symptoms:
      - read-only view after reopen misses committed data after WAL files are removed
      - relaxed exit leaves dirty pages only in page cache (data files stale after power loss)
    verifiers:
      - type: behavior
        path: tests/exit_flush.rs
        note: exit_flush deletes every WAL file in both namespaces and asserts zero remain before reopening; the committed set must survive in both modes (WAL-independent recovery)
      - type: runtime-order
        path: src/map/flush.rs
        note: FlushResult::sync branches on force_fsync to fsync; the fsync-vs-fdatasync distinction is enforced by code review, not by the behavior test
  - id: protocol.wal_format_upgrade_requires_wal_independent_exit
    title: graceful exit must leave the store WAL-independent so WAL format upgrades are safe
    kind: protocol
    status: active
    confidence: high
    statement: >
      After a graceful close (last handle drop) and removal of every WAL file of
      both namespaces (legacy per-group `wal_<group>_<seq>` and the durable
      shared `group_wal_<seq>` stream), reopening must expose exactly the
      committed model: every commit-returned transaction visible with its value,
      and every aborted version invisible (including versions an aborted
      transaction wrote over a committed value).
      Recovery without WAL derives its safe waterline from persisted sequences
      and the final checkpoint's manifest publish. Aborted versions stay
      invisible because the exit path removes them physically: the mandatory
      abort-clean drain completes before the final checkpoint, so the serialized
      pages hold no aborted versions at all. With the wal still present,
      recovery redoes abort-clean from the wal on the next open. Checkpoint
      serialization itself does not filter aborted versions (a leftover
      aborted version would stay reachable, not archived, which is exactly why
      the drain and the wal-replay path matter).
    watch_points:
      - path: src/store/gc.rs
        note: drain_abort_clean_at_exit physically removes aborted versions before the final checkpoint serializes pages
      - path: src/store/recovery.rs
        note: no-WAL recovery derives oracle/safe from persisted sequences; with the wal present it redoes abort-clean from the wal
      - path: src/map/buffer.rs
        note: BucketMgr::quit final checkpoint is the last write before WAL removal
    witnesses:
      - path: tests/exit_flush.rs
        note: delete-every-WAL-in-both-namespaces reopen tests (durable + relaxed) plus aborted-version and aborted-override upgrade scenarios; the helper asserts both namespaces hold zero files before reopening
    failure_symptoms:
      - committed value lost after WAL removal when an aborted txn overwrote it
      - aborted key becomes visible after WAL removal
      - reopen after WAL removal needs any WAL record to rebuild tx outcomes
    verifiers:
      - type: behavior
        path: tests/exit_flush.rs
        note: upgrade_scenario tests delete every WAL file in both namespaces after graceful exit and assert committed-only visibility
  - id: protocol.shutdown_admission_exclusion
    title: transaction admission never races with shutdown in the public API
    kind: protocol
    status: active
    confidence: high
    statement: >
      The public API offers no path where transaction or view admission can run
      concurrently with shutdown. Store::quit is reachable only from Inner::drop,
      which executes when the last Arc<Inner> handle (Mace or Bucket) is dropped;
      begin()/view() require a live bucket borrow, so no thread can be on an
      admission path when quit runs. There is deliberately no runtime admission
      gate. If a public close/quit API that can run while buckets are alive, or a
      drop-order change that releases the store before the buckets, is ever
      introduced, an admission gate must be restored before that path ships.
    watch_points:
      - path: src/store/store.rs
        note: any new public close/quit method on Mace or Store, or a change to Inner::drop ordering, reopens the admission/shutdown race
      - path: src/cc/context.rs
        note: next_group_id / alloc_view_pin are the admission entry points; quit drains in-flight transactions before the force barrier here
    witnesses:
      - path: src/store/store.rs
        note: Store::quit is pub(crate) and called only from Inner::drop; Bucket holds Arc<Inner>, begin()/view() borrow the bucket
      - path: src/cc/context.rs
        note: quit drains in-flight transactions (acquire/release handshake) before the force barrier and joins the collector last
    failure_symptoms:
      - a new public close API admits a transaction after the force barrier or while the collector is stopped
      - a transaction outlives store teardown and touches freed checkpoint/context state
    verifiers:
      - type: runtime-order
        path: src/store/store.rs
        note: quit is reachable only from Inner::drop (last handle); no public close/quit API exists
      - type: regression-test
        path: src/cc/context.rs
        note: quit_waits_for_inflight_then_joins_collector proves the in-flight drain and collector join

