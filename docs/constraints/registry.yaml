schema_version: 1

policy:
  summary: >
    Live constraint ledger for Mace. Entries here must stand on their own instead of
    pointing back to source documents as the primary carrier of the rule.
  source_split:
    design_md: stable architecture and protocol explanation
    registry_yaml: executable live constraint ledger
    retired_md: intentionally removed constraints with retirement reason
  status_meaning:
    draft: observed or inferred but not yet strong enough to rely on
    active: currently relied on and backed by at least one meaningful verifier
    suspect: likely real but must be re-reviewed because evidence is weak, stale, or a watch point changed
    retired: no longer intended to hold and should be moved to retired.md
  kind_meaning:
    local: closed inside one module or data structure
    protocol: spans a bounded sequence of steps or lifecycle phases
    emergent: holds only because several code paths preserve it together
    dependency: depends on upstream or external contract semantics
  minimum_fields:
    - id
    - title
    - kind
    - status
    - statement
    - watch_points
    - witnesses
    - failure_symptoms
    - verifiers

entries:
  - id: protocol.flush_publish_data_first_meta_last
    title: persisted data and blob payloads must become durable before metadata points to them
    kind: protocol
    status: active
    confidence: high
    statement: >
      Any data or blob file that becomes reachable through manifest metadata must be fully written
      and synced before the manifest transaction publishes intervals, stats, map, frontier, or
      `Sequences` metadata that references it. Metadata must never point to non-durable payload files.
    watch_points:
      - path: src/map/flush.rs
        note: file build and stage-orphan sequencing starts here
      - path: src/io/mod.rs
        note: filesystem boundary dispatch for runtime data/blob file opens lives here
      - path: src/io/unix.rs
        note: unix open flag mapping for runtime data/blob/wal files lives here
      - path: src/io/win.rs
        note: windows open flag mapping for runtime data/blob/wal files lives here
      - path: src/utils/options.rs
        note: explicit data/log directory sync helpers used by durability closure live here
      - path: src/store/store.rs
        note: publish ordering between file sync and manifest txn is enforced here
      - path: src/meta/manifest.rs
        note: manifest records orphan markers and metadata publish state here
      - path: src/store/gc.rs
        note: rewrite path follows the same durability ordering for replacement files
    witnesses:
      - path: src/map/flush.rs
        note: staged orphan marker and file build sequence precede metadata publish handoff
      - path: src/store/store.rs
        note: sync built writers before beginning the manifest transaction
      - path: src/store/gc.rs
        note: rewrite stages orphan intent before rewrite output is flushed and clears it in metadata publish
    failure_symptoms:
      - reopen or recovery sees metadata pointing to a file that is missing or truncated
      - crash window leaves a published interval whose payload file is not durable
      - data or blob reads fail after restart despite metadata claiming the file exists
    verifiers:
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: crash windows around flush publish validate orphan cleanup and durable file survival
      - type: runtime-order
        path: src/store/store.rs
        note: publish flow orders sync before manifest commit in code

  - id: protocol.orphan_marker_is_only_cleanup_source
    title: orphan files are cleaned only through explicit Sequences markers
    kind: protocol
    status: active
    confidence: high
    statement: >
      Startup orphan cleanup must rely only on explicit `odf_*` and `obf_*` entries in the
      Sequences metadata bucket.
      Recovery must not scan directories heuristically or infer orphan ranges from max file ids.
      Marker clear failure is fatal because markers are the durable source of truth for orphan cleanup.
    watch_points:
      - path: src/meta/builder.rs
        note: startup orphan cleanup and marker clear happen here
      - path: src/meta/manifest.rs
        note: orphan stage and clear operations are defined here
      - path: src/io/mod.rs
        note: marker-driven cleanup now relies on centralized try_exists/remove_file semantics here
      - path: src/map/flush.rs
        note: flush stages orphan files here
      - path: src/store/gc.rs
        note: rewrite stages and clears orphan markers here
    witnesses:
      - path: src/meta/builder.rs
        note: clean_orphans iterates Sequences markers and forbids max-id probing or directory scans
      - path: src/meta/manifest.rs
        note: stage_orphan_file and clear_orphan_file are the manifest-side carrier of the protocol
      - path: src/store/gc.rs
        note: rewrite path reuses the same orphan marker protocol for replacement files
    failure_symptoms:
      - orphan files remain after recovery despite marker-driven cleanup
      - recovery deletes non-orphan files because cleanup became heuristic
      - orphan marker update panic or crash leaves startup in an unrecoverable state
    verifiers:
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: recovery_orphan_cleanup_after_data_dir_sync_before_marker_clear validates marker-driven cleanup across crash windows
      - type: runtime-assert
        path: src/meta/builder.rs
        note: orphan marker update failure panics instead of silently weakening the protocol

  - id: protocol.interval_map_non_overlap
    title: live interval metadata must remain non-overlapping
    kind: local
    status: active
    confidence: high
    statement: >
      Each inserted data or blob interval must preserve the non-overlap invariant within the
      corresponding `IntervalMap`. Recovery may upsert the same interval key to a new file id, but
      live interval insertion must not create overlapping ranges.
    watch_points:
      - path: src/utils/interval.rs
        note: IntervalMap insert and recovery upsert semantics live here
      - path: src/meta/manifest.rs
        note: interval recovery and in-memory stat interval updates route through this logic
      - path: src/store/store.rs
        note: flush publish inserts new intervals here
      - path: src/store/gc.rs
        note: rewrite/remap intervals are produced here
    witnesses:
      - path: src/utils/interval.rs
        note: extra_check asserts reject overlap on insert and constrain upsert to recovery semantics
      - path: src/store/store.rs
        note: publish path records interval metadata and updates in-memory interval state together
      - path: src/store/gc.rs
        note: rewrite path deletes stale intervals before publishing remapped intervals
    failure_symptoms:
      - interval lookups resolve the wrong file id for a logical address
      - overlap panic under extra_check
      - GC or read path hits inconsistent interval ownership for one address
    verifiers:
      - type: unit-test
        path: src/utils/interval.rs
        note: moha and merge_split cover overlap rejection and find behavior
      - type: runtime-assert
        path: src/utils/interval.rs
        note: insert asserts no overlap under extra_check

  - id: protocol.reloc_completeness_for_mapped_addrs
    title: every mapped address in a published flush batch must resolve through reloc metadata
    kind: protocol
    status: active
    confidence: high
    statement: >
      For any logical address exposed by the published map and interval metadata for a flush batch,
      relocation lookup must succeed. `ivl_map.find(addr)` and reloc lookup must jointly remain valid
      for all mapped addresses in that durable batch.
    watch_points:
      - path: src/map/data.rs
        note: file builder emits interval and reloc metadata here
      - path: src/io/mod.rs
        note: filesystem boundary dispatch for stat and data/blob reader opens lives here
      - path: src/io/unix.rs
        note: unix read/open flag mapping for stat and data/blob readers lives here
      - path: src/io/win.rs
        note: windows read/open flag mapping for stat and data/blob readers lives here
      - path: src/meta/stat.rs
        note: junk/stat apply depends on reloc lookup remaining valid here
      - path: src/store/gc.rs
        note: rewrite builder rebuilds reloc and interval metadata here
      - path: src/store/store.rs
        note: publish path records intervals and stats in one metadata boundary
    witnesses:
      - path: src/map/data.rs
        note: flush file tests assert reloc entries exist for flushed addresses
      - path: src/meta/stat.rs
        note: stat apply uses interval lookup plus reloc lookup as the read-side correctness assumption
      - path: src/store/gc.rs
        note: rewrite builder sorts reloc entries and asserts uniqueness
    failure_symptoms:
      - can't find addr in reloc panic during reopen, recovery, or GC
      - stat apply or read path observes an interval hit with no matching reloc entry
      - persisted file metadata passes interval lookup but cannot locate payload offset
    verifiers:
      - type: unit-test
        path: src/map/data.rs
        note: flush metadata test asserts interval and reloc completeness for flushed addrs
      - type: runtime-assert
        path: src/meta/stat.rs
        note: read/stat paths panic when reloc completeness is violated

  - id: emergent.checkpoint_live_set_only
    title: checkpoint snapshot must flush only the current live dirty set
    kind: emergent
    status: active
    confidence: high
    statement: >
      Checkpoint snapshot may flush only pages reachable from the dirty-root live graph that are not
      already durable. For `addr > snap_addr`, disappearing from both sealed and hot generations is an
      invariant violation. Carry-over of live pages must move page bytes and retired lineage together.
    watch_points:
      - path: src/map/buffer.rs
        note: epoch cut and root/inflight rotation decide the snapshot boundary here
      - path: src/map/data.rs
        note: snapshot traversal, carry-over, and live-set assertions live here
      - path: src/map/publish.rs
        note: replace and evict feed dirty roots and retired lineage into checkpoint closure
    witnesses:
      - path: src/map/buffer.rs
        note: checkpoint atomically rotates hot and sealed generations in one critical section
      - path: src/map/data.rs
        note: snapshot waits inflight writers to zero and asserts live addrs above snap_addr do not disappear
      - path: src/map/data.rs
        note: carry_over_addrs republishes page bytes and retired lineage under one boundary
    failure_symptoms:
      - live page above `snap_addr` disappears from dirty generations before becoming durable
      - checkpoint flushes stale or unreachable pages as if they were live
      - readers observe a page as neither hot nor sealed during churn
    verifiers:
      - type: runtime-assert
        path: src/map/data.rs
        note: extra_check asserts on disappearing live addrs above snap_addr
      - type: runtime-order
        path: src/map/buffer.rs
        note: epoch cut keeps root/inflight rotation atomic in code

  - id: protocol.checkpoint_epoch_cut_atomicity
    title: checkpoint epoch cut must atomically rotate writable and sealed generations
    kind: protocol
    status: active
    confidence: high
    statement: >
      Starting a checkpoint must atomically swap hot generations, publish sealed generations, and
      rotate writer root and inflight slots under one cut. Writers must not straddle that cut, and
      sealed generations must be uniquely owned before checkpoint finish recycles them.
    watch_points:
      - path: src/map/buffer.rs
        note: checkpoint cut, gate locking, and fresh checkpoint barrier live here
      - path: src/map/data.rs
        note: finish path requires unique ownership before recycling sealed generations
    witnesses:
      - path: src/map/buffer.rs
        note: checkpoint uses epochs.gate write lock and one critical section to rotate page/root/inflight state
      - path: src/map/data.rs
        note: sealed generation recycle uses Arc::try_unwrap and waits inflight zero first
    failure_symptoms:
      - writer mutations straddle the cut and become visible in both epochs
      - checkpoint finish panics because sealed generations are still shared
      - dirty roots or inflight state leak across checkpoint boundaries
    verifiers:
      - type: runtime-assert
        path: src/map/data.rs
        note: sealed generation uniqueness is asserted with Arc::try_unwrap
      - type: runtime-order
        path: src/map/buffer.rs
        note: gate plus root/inflight rotation enforce the protocol in code

  - id: emergent.reachable_junk_lifecycle
    title: reachable junk stays readable until durability closure
    kind: emergent
    status: active
    confidence: high
    statement: >
      Any logical address that is still reachable from the live graph must remain readable from
      dirty memory until the matching interval and reloc metadata publish makes it durably readable.
      Structural junk from earlier dirty generations may retire at publish time with EBR deferral,
      but current-generation structural junk and compaction junk must stay discoverable through the
      checkpoint snapshot boundary until the matching owner-page durability closure finishes.
      GC file reclaim and rewrite may consume only junk whose stat and interval effects have
      already crossed that durability boundary; there is no separate scavenge stabilization phase.
    watch_points:
      - path: src/index/tree.rs
        note: merge and split publish paths must keep replace plus mark_unmap within one publish boundary
      - path: src/map/publish.rs
        note: structural and compaction junk classification plus inherited frontier transfer happen here
      - path: src/map/buffer.rs
        note: transfer_junks, retire_junks, and retired_pages decide which junk retires now versus stays visible through checkpoint
      - path: src/map/data.rs
        note: checkpoint snapshot carry-over, retired-page fallback, and new_junks filtering must not classify live addrs as junk
      - path: src/meta/stat.rs
        note: junk apply surfaces interval or reloc holes after premature retirement
      - path: src/meta/manifest.rs
        note: metadata publish closes the durability boundary for junk retirement
      - path: src/store/gc.rs
        note: file reclaim and rewrite must consume only manifest-published junk and stats after durability closure
    witnesses:
      - path: src/index/tree.rs
        note: publish comments and flow require replace plus mark_unmap in one epoch commit
      - path: src/map/buffer.rs
        note: only earlier-generation structural junk retires at publish time while same-generation structural junk and compaction junk stay visible until checkpoint
      - path: src/map/data.rs
        note: new_junks filtering plus retired-page fallback reject live-junk contradictions and disappearing addrs above snap_addr
      - path: tests/junk_reachability.rs
        note: lagging-view regression guard exercises split, consolidate, and checkpoint churn
      - path: src/store/gc.rs
        note: GC file reclaim and rewrite operate from durable manifest stats and no longer perform loaded-page stabilization
      - path: tests/gc.rs
        note: checkpoint-only and single-GC reopen regressions keep deleted blob values from resurrecting without a scavenge phase
    failure_symptoms:
      - lagging snapshot or seek returns NotFound for a key that should still be visible
      - interval lookup misses a still-reachable addr during checkpoint churn
      - extra_check panics because a live addr was classified as junk
      - reopened or long-lived views observe false key loss after churn
      - current-generation junk disappears from hot, sealed, and retired fallback before checkpoint snapshot closure
      - file reclaim or rewrite consumes junk before its owner-page durability closure is durable
    verifiers:
      - type: regression-test
        path: tests/junk_reachability.rs
        note: reachable_junk_regression_guard keeps a lagging view alive across churn
      - type: runtime-assert
        path: src/map/data.rs
        note: extra_check asserts on live-junk contradictions and disappearing addrs
      - type: regression-test
        path: tests/gc.rs
        note: gc_blob_delete_checkpoint_stays_deleted_without_gc and gc_blob_single_gc_run_stays_deleted_after_reopen verify deleted blob values do not resurrect without scavenge

  - id: protocol.flush_junk_atomic_with_owner_durability
    title: junk retirement must be atomic with the durability of the owner page closure
    kind: protocol
    status: active
    confidence: high
    statement: >
      Any junk address retired by a flush or rewrite round must either become durably retired together
      with the owner page closure or be lost together with that closure. The system must not publish a
      half-state where a page is durable but its coupled junk retirement is not, or vice versa.
    watch_points:
      - path: src/store/store.rs
        note: publish applies junk, stats, map, frontier, and Sequences in one manifest transaction
      - path: src/meta/stat.rs
        note: stat apply consumes junk addresses and reloc metadata here
      - path: src/map/data.rs
        note: checkpoint snapshot emits deduplicated junk candidates here
      - path: src/store/gc.rs
        note: rewrite retire path and fully obsolete reclaim interact with junk retirement here
    witnesses:
      - path: src/map/buffer.rs
        note: transfer_junks appends current-round junk lineage to new_base before foreground junk retirement
      - path: src/store/store.rs
        note: publish begins one manifest transaction that includes junk stat apply and map/frontier metadata
      - path: src/map/data.rs
        note: checkpoint emits logically unique junk output only after live graph traversal
      - path: src/meta/stat.rs
        note: junk apply updates stats only while matching interval and reloc metadata remain coherent
    failure_symptoms:
      - durable page images reference an owner closure whose junk retirement is missing
      - GC or publish resurrects or double-retires addresses because junk retirement crossed an invalid boundary
      - reopen hits reloc or interval holes tied to half-persisted junk state
    verifiers:
      - type: regression-test
        path: tests/junk_reachability.rs
        note: lagging-view churn guards against half-persisted reachable junk states
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: manifest crash windows validate metadata atomicity around publish boundaries

  - id: protocol.history_region_key_locality
    title: history traversal must stay inside each key's declared history region
    kind: protocol
    status: active
    confidence: high
    statement: >
      Old-version traversal for a key must stay within that key's declared history region
      `(head_page, start_slot, count)`. Traversal may cross linked history pages inside the region,
      but must never spill into neighboring keys' history entries when history pages are shared.
      Retiring a shared history page must not imply bulk retirement of all referenced blob addresses.
    watch_points:
      - path: src/index/tree.rs
        note: history traversal and lower_bound subrange logic live here
      - path: src/types/base.rs
        note: history region building and sibling-page iteration semantics live here
      - path: src/types/data.rs
        note: encoded HistRef fields define the traversal region here
    witnesses:
      - path: src/index/tree.rs
        note: traverse_hist limits search to key-local active subranges
      - path: src/types/base.rs
        note: history region builder emits explicit page, slot, and count references
      - path: tests/cc.rs
        note: shared-history regression tests assert key-local traversal and no spill into neighbor keys
    failure_symptoms:
      - snapshot get on one key leaks a neighboring key's older history value
      - iteration crosses into another key's history region after compaction
      - history-page retirement incorrectly reclaims blobs still referenced by surviving keys
    verifiers:
      - type: regression-test
        path: tests/cc.rs
        note: get_compacted_shared_hist_page_keeps_key_local_old_versions and get_never_crosses_into_next_key_hist_region_when_own_hist_invisible
      - type: unit-test
        path: src/types/base.rs
        note: builder_leaf_history_region_can_cross_page validates multi-page region boundaries

  - id: protocol.frontier_monotonic_multi_group_closure
    title: durable frontier must monotonically cover every writer group folded into durable closure
    kind: protocol
    status: active
    confidence: high
    statement: >
      Bucket durable frontier is a per-bucket, per-group durable boundary. It must advance monotonically
      and include every writer group's WAL effects that were folded into the current durable closure,
      not only the page-header group. Deferred pages that are neither durable nor folded into the
      current closure must not advance the frontier.
    watch_points:
      - path: src/map/buffer.rs
        note: lineage frontier is collected and merged across retired chains here
      - path: src/map/data.rs
        note: checkpoint snapshot applies page or chain frontier to per-group positions here
      - path: src/meta/manifest.rs
        note: bucket frontier storage and global frontier lower bound live here
      - path: src/store/store.rs
        note: publish persists map and frontier in one manifest transaction here
      - path: src/store/recovery.rs
        note: recovery uses bucket frontier as the correctness gate here
    witnesses:
      - path: src/map/buffer.rs
        note: transfer and carry-over fold page and chain frontier across rewritten lineage
      - path: src/map/data.rs
        note: snapshot applies chain frontier and falls back to header lsn only when no chain frontier exists
      - path: tests/gc.rs
        note: cross-group remote blob update/delete regression exercises owner-lsn lineage through consolidate, checkpoint, and reopen
      - path: src/store/store.rs
        note: publish merges bucket frontier in the same transaction as map/stat metadata
      - path: src/store/recovery.rs
        note: recovery skips redo when WAL record lsn is already <= durable frontier
    failure_symptoms:
      - recovery resurrects an older value because one absorbed writer group was not covered by frontier
      - frontier regresses and causes replay to miss or double-apply folded history
      - WAL gap detection is weakened after a durable recycle boundary
    verifiers:
      - type: regression-test
        path: tests/gc.rs
        note: remote_blob_update_from_other_group_stays_deleted_after_reopen fails when the remote owner delta omits its WAL lsn
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: wal recycle done frontier tests validate durable frontier persistence and gap detection
      - type: runtime-order
        path: src/store/recovery.rs
        note: redo gate explicitly checks durable frontier before enrolling dirty replay state

  - id: protocol.map_and_frontier_publish_atomicity
    title: map metadata and bucket frontier must publish in the same manifest transaction
    kind: protocol
    status: active
    confidence: high
    statement: >
      Page map, interval/stat metadata, bucket frontier, and related Sequences for a flush round must
      publish atomically in one manifest transaction. Crash after commit must leave a consistent
      durable boundary where map visibility and frontier visibility agree.
    watch_points:
      - path: src/store/store.rs
        note: publish assembles the manifest transaction and records frontier here
      - path: src/meta/txn.rs
        note: multi-bucket manifest commit lives here
      - path: src/meta/manifest.rs
        note: frontier merge and persistent frontier record types live here
    witnesses:
      - path: src/store/store.rs
        note: publish records intervals, stats, map, frontier, and Sequences in one transaction
      - path: src/meta/txn.rs
        note: exec_multi commits manifest bucket operations atomically at the metadata backend level
      - path: src/meta/manifest.rs
        note: merge_bucket_frontier updates in-memory and persistent frontier state as one publish unit
    failure_symptoms:
      - recovery sees a frontier that implies data is durable while map metadata does not
      - map metadata becomes visible without the matching frontier advancement
      - crash leaves one publish half visible across manifest buckets
    verifiers:
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: manifest crash windows validate atomicity around multi-bucket commit
      - type: evidence-gap
        path: src/meta/txn.rs
        note: backend multi-bucket atomicity still depends on btree-store contract and should keep being audited

  - id: protocol.recovery_gate_uses_bucket_frontier
    title: recovery must gate redo by bucket durable frontier instead of group checkpoint alone
    kind: protocol
    status: active
    confidence: high
    statement: >
      Recovery analyze and redo must treat bucket durable frontier as the correctness gate for
      whether a WAL record is already durable. Group checkpoint and recycle state are scan-start and
      retention aids, not the sole correctness boundary.
    watch_points:
      - path: src/store/recovery.rs
        note: analyze and redo frontier gate lives here
      - path: src/meta/manifest.rs
        note: durable_frontier_lsn and global frontier lower bound live here
      - path: src/store/store.rs
        note: publish updates checkpoint hints from the durable frontier lower bound here
    witnesses:
      - path: src/store/recovery.rs
        note: recovery skips redo only when WAL position is <= bucket durable frontier
      - path: src/meta/manifest.rs
        note: manifest stores and serves per-bucket frontier positions
      - path: tests/prod_recovery_failpoints.rs
        note: durable frontier crash-window tests cover replay and recycle correctness
    failure_symptoms:
      - replay misses folded history because checkpoint alone was used as correctness gate
      - recovery replays already durable records and resurrects stale states
      - WAL gap rejection becomes weaker after done frontier advancement
    verifiers:
      - type: regression-test
        path: tests/gc.rs
        note: remote_blob_update_from_other_group_stays_deleted_after_reopen catches stale update replay under an incomplete per-group frontier
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: durable recycle frontier and sparse-gap tests validate the recovery gate
      - type: runtime-order
        path: src/store/recovery.rs
        note: analyze gate uses durable frontier before dirty-table enrollment

  - id: protocol.abort_clean_visibility_and_retirement
    title: aborted versions may persist physically but must remain invisible until durability-closed abort-clean retirement
    kind: protocol
    status: active
    confidence: high
    statement: >
      Aborted or in-progress versions may become durable in page images before physical cleanup, but
      visibility rules must keep them invisible until abort-clean retires them. Abort-clean tasks that
      touched pages must not drop abort outcome state until a durability barrier closes the page rewrite.
      Steady-state GC must not load a currently unloaded bucket only to run abort-clean; it may clean
      only buckets that are already loaded. Recovery may temporarily load bucket contexts to drain
      reconstructed abort-clean tasks or inspect WAL state, but startup must unload every such context
      before returning success or surfacing a recovery error.
      Unload or drop must remain blocked and return `OpCode::Again` while bucket-local abort-clean is
      still `Pending`.
    watch_points:
      - path: src/index/tree.rs
        note: page-wide compaction and aborted-head handling live here
      - path: src/cc/context.rs
        note: visibility and active-view state interact with abort outcomes here
      - path: src/meta/manifest.rs
        note: unload path rejects buckets that still have pending abort-clean tasks
      - path: src/store/gc.rs
        note: abort-clean load mode, retirement, and steady-state no-reload semantics live here
      - path: src/store/recovery.rs
        note: recovery reconstructs and drains abort-clean, then unloads any buckets it loaded before startup returns
      - path: src/store/store.rs
        note: phase2 failure must unload recovery-loaded buckets before store abort tears down checkpoint/context
    witnesses:
      - path: src/meta/manifest.rs
        note: unload_bucket returns Again when the bucket still has a pending abort-clean task
      - path: src/store/gc.rs
        note: AbortCleanLoadMode::SteadyState refuses to load unloaded buckets, while recovery mode may load them and still requires checkpoint closure before retirement
      - path: src/store/recovery.rs
        note: recovery drains reconstructed abort-clean tasks and evicts all loaded buckets before open returns or before aborting startup
      - path: src/store/store.rs
        note: Mace::new calls Recovery::abort before Store::abort when phase2 fails
      - path: tests/gc.rs
        note: drop_bucket remains blocked during pending abort-clean, recovery drain finishes before open returns, and recovery does not leave the bucket loaded
    failure_symptoms:
      - another snapshot sees an aborted value after reopen or churn
      - abort-clean drops outcome state before rewritten pages are durable
      - steady-state GC silently reloads a user-unloaded bucket just to run abort-clean
      - recovery returns with abort-clean buckets still loaded in the runtime cache
      - recovery error teardown panics while dropping a recovery-loaded bucket after checkpoint infrastructure is already shut down
      - drop_bucket or unload succeeds while page-touching abort-clean is still pending
    verifiers:
      - type: regression-test
        path: tests/gc.rs
        note: recovery_drains_abort_clean_before_startup_returns, recovery_abort_clean_does_not_leave_bucket_loaded_after_startup, and related drop_bucket tests cover the lifecycle
      - type: failpoint-test
        path: tests/prod_recovery_failpoints.rs
        note: recovery abort-clean crash windows validate ordering around drain and runtime GC start
      - type: unit-test
        path: src/store/recovery.rs
        note: abort_unloads_recovery_loaded_buckets_before_store_abort proves failure teardown drops recovery-loaded buckets before store abort

  - id: protocol.runtime_checkpoint_enable_waits_for_recovery_abort_clean
    title: runtime checkpoint enable and WAL recycle must stay gated behind recovery abort-clean drain
    kind: protocol
    status: active
    confidence: high
    statement: >
      During startup, recovery must finish reconstructing and draining pending abort-clean tasks before
      runtime checkpoint recording is enabled. Until that gate opens, `update_checkpoint` must not
