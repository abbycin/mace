schema_version: 2

# Concrete invariants, one entry each. The five concerns, the admission rule, the entry
# schema and the maintenance rules live in README.md; `protects` names the concern an
# entry serves. An invariant that does not serve one of the five does not belong here.

entries:
  - id: durable_fact_waits_for_shared_wal_cut
    title: modified commit publishes its fact only after the shared wal cut covers its target
    protects: data-loss
    status: active
    statement: >
      A modified transaction's commit fact becomes Committed only after the generation sealing a cut >=
      the commit record's target completes successfully; every successful ticket observes durable_pos >=
      target. A failed generation broadcasts the same error to all participants and no fact is published.
      An orphaned generation (leader ticket dropped before complete) is failed with the error and the sync
      state is reset, so no waiter hangs and no fact is published for it.
    break_consequence: >
      A commit returns success while its WAL records are still only in the page cache, or a failed
      generation still publishes a fact. A crash right after loses a transaction the caller was told is
      durable.
    anchors:
      - src/index/txn.rs
      - src/cc/log.rs
    reproducer: durable_commit_publishes_fact_only_after_wal_cut_is_durable
  - id: durable_generation_sync_covers_all_sealed_writers
    title: only a generation leader syncs, and it syncs every writer sealed by its cut
    protects: data-loss
    status: active
    statement: >
      In the durable route, advance, ring overflow, auto-stable flush, large-record append, and the
      checkpoint hint are flush-only and never advance durable_pos. A generation leader must sync every
      writer detached by rotation before its sealed cut plus the current writer and the log directory, and
      advance durable_pos to the sealed cut only after success; the wal sync counter increments only when
      a leader attempts a physical sync round.
    break_consequence: >
      A writer detached by rotation is never synced. Its committed records live only in the page cache, so
      a crash right after the commit returned loses a transaction the caller was told is durable.
    anchors:
      - src/cc/log.rs
    reproducer: rotation_writers_are_synced_by_generation_and_survive_reopen
  - id: protocol.data_blob_file_version_gate
    title: data and blob readers must reject unsupported footer versions and fields
    protects: data-loss
    status: active
    statement: >
      Data and blob writers emit the current `FileVersion::V1` footer format. Readers must reject an
      unknown footer version or non-zero fields that are unsupported for that version before consuming
      relocation or interval metadata. Checkpoint and GC rewrites must emit the current version and may
      not copy an incompatible encoded payload without an explicit migration rule. A future format may
      coexist only after its reader support and migration boundary are recorded in the design and this
      ledger.
    break_consequence: >
      A payload file written by a different format version is parsed as ours, so its records are read as
      valid data and its bytes are rewritten in our layout. Committed values are silently corrupted.
    anchors:
      - src/map/data.rs
    reproducer: rewrite_builder_keeps_compressed_v1_records_compressed
  - id: protocol.filesystem_io_errors_do_not_collapse_to_absence
    title: startup directory prep, recovery bootstrap, and runtime probe/open paths must not collapse fs faults into absence
    protects: data-loss
    status: active
    statement: >
      Filesystem operations routed through Mace's `FileSystem` boundary for startup directory creation and
      sync, recovery bootstrap enumeration and existence probes, and runtime file probe/open decisions
      must preserve non-`NotFound` I/O failures. These paths may intentionally treat `NotFound` as absence
      only where the protocol already models absence explicitly, such as `remove_file_if_exists`; they
      must not reinterpret other I/O failures as `false`, `None`, or empty directory scans. This entry
      does not duplicate orphan cleanup, obsolete-stat cleanup, or steady-state WAL recycle cleanup, which
      remain owned by `protocol.orphan_marker_is_only_cleanup_source`,
      `protocol.bucket_delete_two_phase_counter`, `protocol.wal_recycle_safe_boundary`, and
      `protocol.wal_recycle_state_bootstrap_completion`.
    break_consequence: >
      An I/O failure is read as "the file is not there", so cleanup or a rewrite unlinks a file that is
      actually live. The commit that referenced it is lost, and the failure is invisible because the code
      believed the file was already absent.
    anchors:
      - src/io/mod.rs
      - src/utils/options.rs
    reproducer: remove_file_if_exists_propagates_non_not_found_error
  - id: protocol.flush_publish_data_first_meta_last
    title: persisted data and blob payloads must become durable before metadata points to them
    protects: data-loss
    status: active
    statement: >
      Any data or blob file that becomes reachable through manifest metadata must be fully written and
      synced before the manifest transaction publishes intervals, stats, map, frontier, or `Sequences`
      metadata that references it. Metadata must never point to non-durable payload files. The epoch
      migration's completion point follows the same rule: the target loggers' era files must have durable
      directory entries before `BUCKET_MISC/options` records the width change, so the epoch handoff calls
      `sync_log_dir()` before the options writeback, and crash recovery can never observe a migrated width
      whose era is not on disk.
    break_consequence: >
      A reopen reads a payload file that was never synced. Committed values are gone or read as zeros
      while the manifest already claims the file exists, so recovery cannot tell data loss from an empty
      file.
    anchors:
      - src/map/flush.rs
      - src/store/store.rs
      - src/store/gc.rs
    reproducer: oversized_data_rewrite_splits_outputs_and_reopens
  - id: protocol.graceful_exit_flushes_all_dirty_pages
    title: graceful exit must flush every dirty page with a full fsync
    protects: data-loss
    status: active
    statement: >
      A graceful close (last handle drop) must persist every live dirty page into the data/blob files
      written by the final checkpoint, with a full fsync before that checkpoint's manifest publish,
      regardless of `sync_on_write`. It must drain every pending abort-clean task before the final
      checkpoint, so a clean close leaves no aborted bytes in the data files; the drain itself may dirty
      pages, and those pages belong to the subsequent final checkpoint.
    break_consequence: >
      A clean exit leaves dirty pages only in memory. The next open has neither a WAL record nor a durable
      page for them, so writes the caller saw acknowledged are gone, with no torn page to explain the
      loss.
    anchors:
      - src/map/flush.rs
      - src/map/buffer.rs
    reproducer: durable_exit_leaves_all_committed_in_data_files
  - id: protocol.wal_recycle_safe_boundary
    title: WAL recycling must stay behind active txn, checkpoint, and pending abort-clean boundaries
    protects: data-loss
    status: active
    statement: >
      WAL recycling must not delete files beyond the safe boundary: the minimum of the active-transaction
      boundary, the last durable checkpoint boundary, any file still pinned by a pending abort-clean task,
      and the durable recycle frontier state. A runtime logger's stale oldest id must be clamped to the
      persisted done boundary when building a recycle intent, and an empty clamped range must not replace
      done state. A modified abort must publish its pending abort-clean task
      before releasing the group logging mutex that keeps the active-transaction pin alive, so the two
      pins overlap with no unprotected handoff window. Protocol detail: `docs/design.md` 8.4 and 10.
    break_consequence: >
      A WAL file is deleted while a transaction, a checkpoint, or an abort-clean task still needs it. The
      next open finds a gap inside a retained range and refuses the database, losing every commit after
      the gap.
    anchors:
      - src/meta/manifest.rs
      - src/store/recovery.rs
    reproducer: abort_clean_pin_is_published_before_logging_handoff_releases
  - id: protocol.wal_update_validation_precedes_consumption
    title: WAL Update bounds, checksum, and layout must validate before consumption
    protects: data-loss
    status: active
    statement: >
      Every WAL Update reader must validate the payload size and total record length before reading the
      payload, then validate entry type, checksum and payload layout before using key, value, transaction
      or `prev` fields. The logical group-id bound comes from the open phase: recovery validates against
      the source group count for every retained stream it scans, the runtime admits only ids below the
      target count, and after the forced checkpoint and epoch wipe no reader consults the retired source
      group table again.
    break_consequence: >
      A malformed record's key, value, transaction or prev link is used before validation, so recovery
      replays garbage as committed data and a wrong value becomes durable. The logical group bound is read
      from the open phase, not a global constant, so a retired group id is never answered as history.
    anchors:
      - src/cc/wal.rs
      - src/store/recovery.rs
    reproducer: update_record_validation_rejects_inconsistent_layout
  - id: protocol.invariant_failure_is_fail_stop
    title: an invariant failure prints its report and then aborts the process
    protects: crash-safety
    status: active
    statement: >
      `must_ok!`, `must_exist!` and `must_true!` (and `hot_true!` where it applies) report the failed
      check, its caller, the message, the captured arguments, the error and a backtrace on stderr, print
      the failure line naming the check and its message, flush stdout and stderr, and then abort the
      process. The failure must not unwind: unwinding would run destructors and hand control back to code
      that assumes the invariant held. No panic hook runs on this path, so the report carries its own
      backtrace, and the release profile's `panic = "abort"` behavior is uniform across profiles.
    break_consequence: >
      An invariant failure unwinds and the process continues on state that violates the invariant. A
      detectable fault becomes silent data loss, leaked space, or a wrong read, and no log says which
      invariant broke.
    anchors:
      - src/error/mod.rs
    reproducer: a_fatal_failure_aborts_the_process
  - id: protocol.wal_recycle_state_bootstrap_completion
    title: durable wal recycle intent and done state must complete before bootstrap scanning
    protects: crash-safety
    status: active
    statement: >
      The durable `wrc_*` recycle state is the startup source of truth for recycle progress. Recovery must
      complete any durable pending recycle intent before WAL bootstrap scanning, and the done state must
      stay durable enough to serve as the retained frontier once earlier files are gone. A stream's
      retained scan starts at that boundary, and a checkpoint discovered there may start later only at a
      validated hint that does not precede it. Protocol detail: `docs/design.md` 8.4.
    break_consequence: >
      A crash between a durable recycle intent and its done state leaves the next open scanning from a
      stale boundary: it either replays a segment that was already deleted, or refuses the database, so a
      clean shutdown is not recoverable.
    anchors:
      - src/meta/manifest.rs
      - src/store/recovery.rs
    reproducer: remove_wal_prefix_enumerates_present_files_instead_of_sparse_ids
  - id: wal_position_epoch_monotonic_across_route_switch
    title: every route-switch, layout-migration, or width-change reopen starts the new era at a globally monotonic file-id epoch; same-route matched-layout reopens continue in-stream
    protects: crash-safety
    status: active
    statement: >
      A route-switch reopen, a `concurrent_write` change, or a same-route physical layout migration
      computes a global file-id high water over all WAL files, persisted bucket frontiers and recycle
      states, fully recycles the old WAL, and starts the new era at that high water plus one; the previous
      era's files are never appended to. A same-route reopen with a matched layout skips the epoch and
      continues each stream in its existing latest file, scanning from its durable done boundary. A real
      missing file inside a stream range, or a high-water overflow, is a corruption error. Protocol
      detail: `docs/design.md` 9.3.
    break_consequence: >
      A reopen appends into the previous era's last file, or a wipe leaves a stream without a durable done
      boundary. The next open then sees a gap inside a retained range and refuses the database, or replays
      a mix of two eras into one tree.
    anchors:
      - src/store/recovery.rs
      - src/meta/manifest.rs
      - src/cc/log.rs
    reproducer: migration_retires_every_source_stream_and_records_the_target_width
  - id: wal_recovery_truncates_at_first_malformed_record
    title: recovery truncates each physical stream at the first malformed record start
    protects: crash-safety
    status: active
    statement: >
      Recovery validates records per physical stream in order (header, length, payload, checksum). At the
      first malformed or incomplete record the scan stops at that record's start; with
      truncate_corrupted_wal enabled the file is truncated there and later files of the stream are not
      scanned; otherwise OpCode::Corruption is returned. There is no persisted fsync watermark and runtime
      durable_pos is not a truncation boundary. When truncation occurs after an active writer was opened,
      recovery must rebase that writer's runtime positions to the truncated physical EOF before any
      checkpoint, cleanup, or foreground append can use them.
    break_consequence: >
      Recovery scans past a malformed record into later records or files, so a torn tail silently becomes
      replayed data and a crash during recovery re-applies effects that were already durable. With
      truncation disabled the same tail must refuse the open instead of guessing.
    anchors:
      - src/store/recovery.rs
    reproducer: wal_tail_corruption_truncates_at_first_bad_record
  - id: protocol.bucket_delete_two_phase_counter
    title: bucket deletion is two-phase and nr_buckets includes pending delete buckets until physical cleanup finishes
    protects: space-leak
    status: active
    statement: >
      Bucket deletion must occur in two phases: logical delete removes the live meta entry and inserts
      `pending_del`, then GC clears and destroys the corresponding page and interval buckets in the
      metadata backend before removing the pending record. `nr_buckets` must include pending-delete
      buckets and may decrement only after physical cleanup completes.
    break_consequence: >
      Unlinking before the pending entry is durable loses the bucket's committed data when the process
      dies in between. Decrementing the bucket counter before the physical cleanup leaves a half-deleted
      bucket the next open still has to reconcile, and its payload lingers.
    anchors:
      - src/store/gc.rs
      - src/meta/manifest.rs
    reproducer: fast_pending_delete_counter
  - id: protocol.orphan_marker_is_only_cleanup_source
    title: orphan files are cleaned only through explicit Sequences markers
    protects: space-leak
    status: active
    statement: >
      Startup orphan cleanup must rely only on explicit `odf_*` and `obf_*` entries in the Sequences
      metadata bucket. Recovery must not scan directories heuristically or infer orphan ranges from max
      file ids. Marker clear failure is fatal because markers are the durable source of truth for orphan
      cleanup.
    break_consequence: >
      Cleanup becomes heuristic (max file id, directory scan) and unlinks a file that is still referenced,
      losing the data in it. The opposite drift keeps a file that is already dead, and its space is never
      reclaimed.
    anchors:
      - src/meta/builder.rs
      - src/meta/manifest.rs
    reproducer: chaos_failpoint_recovery_orphan_cleanup_after_data_dir_sync_before_marker_clear
  - id: protocol.persist_stat_decode_bounds
    title: persisted stat metadata must be bounds-checked before unsafe decoding
    protects: space-leak
    status: active
    statement: >
      Every persisted `PersistStat` record consumed during startup or lazy bitmap loading must validate
      the header, body length arithmetic, inactive-sequence count, and sequence bounds before reading
      bytes or setting bitmap entries, so malformed metadata can never be over-read and a corrupt inactive
      sequence can never silently change accounting. The validation covers both the eager inner-stat path
      and the lazy mask path. How a failed validation surfaces is owned elsewhere: the production callers
      treat it as an invariant failure and abort (`protocol.invariant_failure_is_fail_stop`), while the
      offline checker uses the fallible variants to report the record without aborting.
    break_consequence: >
      A corrupt stat record decodes into wrong counts, so live bytes look like junk and a still-referenced
      file is unlinked, losing the committed data in it. The same record also aborts the open, leaving no
      readable database at all.
    anchors:
      - src/meta/entry.rs
      - src/meta/stat.rs
    reproducer: a_declared_sequence_count_beyond_the_record_is_a_corruption
  - id: protocol.persist_stat_inactive_bitmap_monotonic
    title: persisted inactive bitmap must retain every prior junk sequence
    protects: space-leak
    status: active
    statement: >
      For every retained data or blob file, the persisted `PersistStat.inactive_elems` value must encode
      the complete inactive sequence set represented by the in-memory stat bitmap at the manifest publish
      boundary. A later checkpoint may add inactive sequences but must never drop an already persisted
      sequence while the file remains retained. Reopen must reconstruct the same inactive set, so a page
      that was durably retired cannot become GC-active again solely because a later stat update overwrote
      the metadata value. If a retained file needs a lazy bitmap load while recording newly observed junk,
      a missing or unreadable stat is a failed checkpoint publish, not permission to omit that junk; only
      a file already retired by GC may be skipped because its reclaim/rewrite owner has taken over
      accounting.
    break_consequence: >
      A dropped inactive sequence makes durable junk look live forever. The space is never selected for
      reclaim, so the data directory grows under steady load with no way to shrink it.
    anchors:
      - src/meta/stat.rs
      - src/meta/entry.rs
    reproducer: full_mask_persistence_keeps_prior_inactive_sequences
  - id: protocol.persist_stat_matches_payload_relocations
    title: GC space accounting must exactly match retained data/blob payloads
    protects: space-leak
    status: active
    statement: >
      The relocation tables in retained data/blob files are the authoritative space ledger. At a stable
      point after checkpoint, GC or recovery, durable reachability is derived independently from
      page-table roots, page links, history references and leaf remote-blob references, scoped by
      `(bucket_id, logical_addr)`. A retained relocation is inactive if and only if its address is absent
      from that reachable set, and the element and byte totals equal the relocation count and the stored
      active-length sum.
    break_consequence: >
      Retained bytes counted as live are never selected for reclaim, so a steady workload grows the data
      directory without bound. The same accounting error in the other direction marks a still-referenced
      file as junk and unlinks it, losing the committed data in it.
    anchors:
      - src/meta/stat.rs
      - src/store/gc.rs
    reproducer: persisted_data_and_blob_stats_match_payloads_through_gc_and_reopen
  - id: protocol.reloc_completeness_for_mapped_addrs
    title: every mapped address in a published flush batch must resolve through reloc metadata
    protects: space-leak
    status: active
    statement: >
      For any logical address exposed by the published map and interval metadata for a flush batch,
      relocation lookup must succeed. `ivl_map.find(addr)` and reloc lookup must jointly remain valid for
      all mapped addresses in that durable batch.
    break_consequence: >
      A mapped address has no relocation entry. The bytes behind it can never be reclaimed, and a read of
      that address fails instead of returning the value the map promised.
    anchors:
      - src/map/data.rs
      - src/meta/stat.rs
    reproducer: data_dump_load
  - id: protocol.stat_retirement_and_rewrite_junk_handoff
    title: retired stat ownership and rewrite junk transfer must remain gap-free through admission gating
    protects: space-leak
    status: active
    statement: >
      A checkpoint must acquire the permit for its file kind before opening the metadata transaction that
      changes owner stats, and must hold that permit through the metadata commit and runtime bookkeeping.
      Reclaim and rewrite close the same kind gate, drain all permits, publish the owner transition, and
      reopen the gate only after runtime state is switched. A checkpoint admitted after reopening resolves
      against the current owner. No independent handoff lock is added.
      Protocol detail: `docs/design.md` 11.1 and 11.3.
    break_consequence: >
      A checkpoint or a rewrite loses ownership of an address: copied bytes are never marked inactive and
      stay unreachable forever, or an old stat is resurrected after its file is gone, so a read resolves a
      deleted file.
    anchors:
      - src/store/gc.rs
      - src/meta/stat.rs
    reproducer: lagging_checkpoint_cannot_resurrect_retired_stats_at_any_reclaim_cut
  - id: protocol.junk_admission_gate_is_bounded_and_fair
    title: junk admission gates close and reopen without accepting or starving producers
    protects: concurrency
    status: active
    statement: >
      For each file kind, closing the junk gate and draining permits use one collector lock: no new
      producer permit is admitted after close, every permit is released on all normal paths, and drain
      completes once the permits already in flight leave. A waiter holds no metadata transaction while
      the gate is closed, and a failed multi-kind acquisition releases any permit already acquired before
      waiting for the other kind. The gate reopens after owner publication or cancellation, so later
      checkpoints and foreground producers make progress.
    break_consequence: >
      A producer can mutate owner accounting during a reclaim cut, or a permit can remain held forever,
      leaving checkpoints blocked, the collector spinning, or the process unable to make progress.
    anchors:
      - src/meta/stat.rs
      - src/map/adapter.rs
      - src/store/gc.rs
    reproducer: junk_gate_rejects_permits_until_drain_and_drop
  - id: protocol.reclaim_delete_tolerates_a_prior_retirement
    title: a reclaim-path metadata delete tolerates a key an earlier round already retired
    protects: space-leak
    status: active
    statement: >
      Two producers may retire the same file: the fully-obsolete reclaim and `Manifest::delete_bucket`. Both
      record a `Delete` for it, and the same id can also be queued, drained and queued again, so the two
      deletion-completion records that a reclaim path owns must treat an already-absent key as a miss
      instead of a fault: the file's stat key delete and its obsolete-marker clear. The metadata store
      reports a miss from `del` as a value, and a commit counts it under `FlushConditional{Data,Blob}DelMiss`
      so the tolerance stays observable. Every other metadata delete keeps the strict contract: an absent
      frontier, pending-delete, bucket-metas, interval or orphan-marker key reports and aborts the process,
      because there its absence is a broken protocol invariant rather than a completed cleanup. Never: a
      legal interleaving of two reclaim paths failing the whole metadata transaction, and never a strict
      delete quietly swallowing a key that should have existed.
    break_consequence: >
      An ordinary concurrent workload (a bucket delete racing the reclaim of a fully obsolete file) aborts
      the process on a release build and kills the gc thread on an unwinding build, which then stops space
      reclamation for the life of the process: the data directory grows with no way to shrink it.
    anchors:
      - src/meta/entry.rs
      - src/meta/txn.rs
      - src/store/gc.rs
    reproducer: bucket_delete_racing_obsolete_reclaim_keeps_committed_values
  - id: protocol.transaction_checkpoint_span_follows_group_counter
    title: max_ckpt_per_txn enforcement follows the transaction's own logical-group checkpoint counter
    protects: space-leak
    status: active
    statement: >
      A transaction's checkpoint-span limit is measured against the checkpoint counter of its own logical
      group. Shared Logging tracks Begin/Update/Commit/Abort activity independently for each group. A
      publish round may append one physical checkpoint record, but advances a group's counter exactly once
      only when that group had WAL activity since its prior publish; unrelated-group activity cannot age
      it. A disabled or no-activity publish ages no group. Relaxed per-group loggers keep their single
      own-group counter and the same activity rule.
    break_consequence: >
      A group's checkpoint counter is aged by another group's activity, so a long transaction is force-
      checkpointed far earlier or later than the configured span. Retained WAL segments and pinned MVCC
      history then outlive the bound the operator configured, and the data directory keeps growing long
      after the work is done.
    anchors:
      - src/cc/log.rs
      - src/utils/options.rs
    reproducer: durable_group1_transaction_enforces_max_ckpt_per_txn
  - id: emergent.checkpoint_live_set_only
    title: a checkpoint flushes exactly the live dirty set under one atomic epoch cut
    protects: visibility
    status: active
    statement: >
      A checkpoint may flush only the pages reachable from the dirty-root live graph that are not already
      durable, and must not write stale or unreachable pages as if they were live. Starting a checkpoint
      is a single cut that swaps the hot generations, publishes the sealed generations and rotates the
      writer root and inflight slots together; no writer straddles the cut, and a live page carried into
      the next round moves its bytes and its retired lineage together. Never: a page above the cut that is
      still live disappearing from both the sealed and the hot generation before it is durable, or a
      reader observing a page that is momentarily in neither generation.
    break_consequence: >
      A live reader is refused the page it must see, so a get or an iteration loses a key that exists; the
      same cut is what lets a flush close an old generation and release its bytes, so a broken cut also
      strands dirty pages and their space.
    anchors:
      - src/map/buffer.rs
      - src/map/data.rs
    reproducer: checkpoint_cut_keeps_post_cut_writer_visible
  - id: emergent.reachable_junk_lifecycle
    title: a reachable address stays readable until its metadata is durable, and junk retires atomically with its owner page
    protects: visibility
    status: active
    statement: >
      Any logical address still reachable from the live graph -- through links, sibling hints or remote
      hints -- must stay readable from dirty memory until the matching interval and relocation metadata
      publish makes it durably readable; such an address may never be in the state "not in dirty memory
      and not yet in interval metadata". Junk is split by lifecycle: only structural junk from earlier
      dirty generations may retire at publish time under EBR deferral, while current-generation structural
      junk and compaction junk stay discoverable through the checkpoint snapshot boundary until the owner
      page's durability closure finishes, and any junk a flush or rewrite retires must become durable
      together with that owner closure or be lost together with it. File reclaim and rewrite may consume
      only junk whose stat and interval effects already crossed that boundary. Never: an interval lookup
      missing a still-reachable address during checkpoint churn, or a durable page image whose owner
      closure lost its junk retirement. Protocol detail: `docs/design.md` 11.1, 11.3.
    break_consequence: >
      A lagging snapshot or a seek returns NotFound for a key that exists, or a reopened or long-lived
      view observes false key loss; the same retirement boundary is what makes the bytes reclaimable at
      all, so a half-published retirement also leaks pages that were never durably retired.
    anchors:
      - src/map/buffer.rs
      - src/map/data.rs
      - src/store/gc.rs
    reproducer: reachable_junk_regression_guard
  - id: protocol.abort_clean_visibility_and_retirement
    title: an aborted version stays invisible until abort-clean retires it, and that retirement is gated behind recovery
    protects: visibility
    status: active
    statement: >
      Aborted or in-progress versions may become durable in page images, but visibility must keep them
      invisible until abort-clean retires them, and abort-clean must not drop its outcome state until a
      durability barrier closes the page rewrite. Abort-clean walks only its task's retained WAL range,
      requires each prev link to move strictly backward, and spends a step budget derived from the
      retained bytes; a missing file, a bad record bound, a self-loop, a forward link, a range escape or
      an exhausted budget is reported as corruption with the task, the abort fact and the WAL pin
      retained. Recovery must finish reconstructing and draining pending abort-clean tasks before runtime
      checkpoint recording is enabled, and neither the runtime checkpoint nor WAL recycle may run before
      that gate opens. The durable WAL analysis hint must not advance past any pending abort-clean task's
      earliest retained position: recovery starts record analysis there, and an aborted transaction's only
      durable trace is its abort record, so a floor (and therefore a hint) advanced past it would drop the
      task and leave the aborted versions looking committed. A floor advance is clamped by the task pin for
      its physical stream, under the same logging lock that keeps a task's registration atomic against the
      advance. Never: another snapshot observing an aborted value after a reopen, a corrupted
      chain releasing the abort fact and the WAL pin, or post-recovery GC recycling WAL before any runtime
      checkpoint exists. Protocol detail: `docs/design.md` 10.
    break_consequence: >
      A reader is handed a value from a transaction that aborted, or a key deleted by an aborted
      transaction comes back after reopen; recycling the WAL that abort-clean still needs also makes the
      following recovery unrecoverable.
    anchors:
      - src/store/gc.rs
      - src/store/recovery.rs
      - src/cc/log.rs
      - src/map/adapter.rs
    reproducer: abort_clean_hint_window_same_file
  - id: protocol.concurrent_write_epoch_migration
    title: a concurrent_write change migrates the epoch instead of rejecting the open, and is recorded only once it completed
    protects: visibility
    status: active
    statement: >
      When a reopen requests a different concurrent_write or a different route from the persisted value,
      the open derives a plan for the source and target group counts and rebuilds the WAL epoch before
      any runtime context for the requested route exists: recovery scans at the persisted width while
      the era wipe and recycle completion cover every stream up to max(source, target) and leave a
      durable done boundary for each, including streams only the target width owns; a stream already
      at or above the new era start is left untouched, which is every stream of a namespace that
      holds no WAL file, no bucket frontier and no recycle state. The runtime era that serves the requested route is
      installed only after that wipe -- into the recovered context itself when the width is unchanged and
      only the route changes, into the target context when the width changes -- and the persisted options
      are written back only after that runtime era is installed, the swept streams' done boundaries are
      durable and the new era's log directory is synced, so an interrupted migration re-runs instead of
      half-applying. A manifest is initialised only once its version and its
      persisted global options are durable together, and a missing or undecodable options record on an
      initialised manifest is corruption, never a default to rebuild. Never: a resize rejected as an
      incompatible open while committed data is on disk, a reader answering a record owned by a retired
      group through the target group table, or options recording the target width for a migration that
      never completed. Protocol detail: `docs/design.md` 9.3, 3.6.
    break_consequence: >
      A database that is readable refuses to open after a resize, or opens onto a width for which its
      committed records were never settled, so a reader gets an incompatible-open error or a partially
      empty key space; a writeback that runs before the migration completes or a recovery that runs at the
      wrong width also loses history on the next open.
    anchors:
      - src/meta/builder.rs
      - src/store/recovery.rs
      - src/store/store.rs
    reproducer: global_options_resize_migrates_the_epoch_and_writes_options_back
  - id: protocol.graceful_exit_wal_independent_visibility
    title: graceful exit must leave the store WAL-independent with committed-only visibility
    protects: visibility
    status: active
    statement: >
      After a graceful close and removal of every WAL file of both namespaces, reopening must expose
      exactly the committed model: every commit-returned transaction visible with its value, and every
      aborted version invisible, including an aborted write over a committed value. The WAL-free safe
      waterline is derived from persisted sequences and the final checkpoint's manifest publish, and
      abort-clean is redone from the data files before any reader observes them.
    break_consequence: >
      After a clean exit that removed the WAL, a reader sees a value the transaction never committed, or a
      committed value disappears, because visibility was still derived from WAL state that no longer
      exists.
    anchors:
      - src/store/store.rs
    reproducer: walless_clean_exit_keeps_only_pages_with_the_old_high_group
  - id: protocol.interval_map_non_overlap
    title: live interval metadata must remain non-overlapping
    protects: visibility
    status: active
    statement: >
      Each inserted data or blob interval must preserve the non-overlap invariant within the corresponding
      `IntervalMap`. Recovery may upsert the same interval key to a new file id, but live interval
      insertion must not create overlapping ranges.
    break_consequence: >
      Two intervals cover the same logical address, so a read resolves the wrong file and returns another
      key's bytes. The bytes behind the shadowed interval are also unreachable and leak.
    anchors:
      - src/utils/interval.rs
    reproducer: merge_split
  - id: protocol.merge_compact_preserves_snapshot_and_frontier
    title: structural maintenance preserves what every live reader sees and what recovery will replay
    protects: visibility
    status: active
    statement: >
      Compaction may materialise a merge run into a plain base only for the contiguous run older than the
      compact safe boundary, stamping that boundary's group and version onto the result, keeping every
      newer version verbatim, and propagating each absorbed operand's WAL position into the result's
      lineage frontier so recovery neither redoes nor skips an operand. A retained abort is never folded
      in, a chain with no usable operator stays raw-preserving, structural maintenance that could
      interpret a merge chain is deferred while the context is recovering, and a rebuild materialises a
      stored inline row that now crosses the size boundary into a real remote record. Never: a long-lived
      view observing a fold where its snapshot requires the pre-fold intermediate, an aborted operand's
      bytes inside a durable base, a compacted base that drops committed operands behind its history
      pointer, or a rebuilt row encoded as a remote record with address zero. Protocol detail:
      `docs/design.md` 6, 7.1.
    break_consequence: >
      A reader that pinned its snapshot before the maintenance sees a different value for the key, or one
      that was never committed; after a crash recovery either replays an already-absorbed operand or skips
      a committed one, and a rebuilt row with a null address reads back as NotFound for a key that exists.
    anchors:
      - src/types/node.rs
      - src/map/buffer.rs
      - src/store/recovery.rs
    reproducer: materializing_compact_keeps_long_view_stable
  - id: protocol.positive_proof_rechecks_abort_state
    title: a reader's visible set is monotone -- a rising watermark, and one re-checked verdict
    protects: visibility
    status: active
    statement: >
      A snapshot's visible set is fixed by a watermark that may only rise, and a record enters it only
      when the one shared verdict accepts it. A modified transaction holds terminal-publication ownership
      from before its commit timestamp is allocated until its terminal fact is published; a safe boundary
      is published only after an oracle cut folded every live writer and reader under one global order;
      the collector starts only after recovery published the recovered oracle; a safe prefix is published
      before any pruning that relies on it; and a snapshot's pin stays live until every iterator and
      borrowed value derived from it is dropped. The same verdict drives conflict detection, so at most
      one of two overlapping writers on a key commits. A version accepted by a positive proof is still
      validated against abort state afterwards, and a persisted group id at or above the current width is
      answered as settled history without touching the group table. Never: a version committed before a
      live reader's cut turning invisible, a reader seeing a version whose terminal fact was not published
      at its cut, an aborted provisional version being returned, or two overlapping writers both
      committing on one key. Protocol detail: `docs/design.md` 5.1, 5.3, 5.4.
    break_consequence: >
      A reader that is not the oldest live view loses a key it must see, is handed a value from a
      transaction that had not finished publishing, or is handed a value from a transaction that aborted;
      a get can also return NotFound or a stale value for a key whose committed record lives in a retired
      group. The same ordering keeps committed history from being pruned under a still-live reader and the
      recovered watermark from regressing under a collector round, and the settled-history shortcut is
      sound only because the epoch migration settled, abort-cleaned and wiped the old era first, so both
      halves also underpins crash-safe reopen.
    anchors:
      - src/cc/mod.rs
      - src/cc/group.rs
      - src/store/store.rs
    reproducer: collector_cut_includes_begin_registration_before_fact_publish
  - id: protocol.recovery_gate_uses_bucket_frontier
    title: map metadata and the bucket frontier publish together, and the frontier covers every group folded into the closure
    protects: visibility
    status: active
    statement: >
      Page map, interval and stat metadata, the bucket frontier and the related sequences for one flush
      round must publish in a single manifest transaction, so a crash never leaves map visibility and
      frontier visibility disagreeing. The frontier must cover every logical group whose WAL effects are
      folded into that round's durable closure, whether the content was persisted in the round or was
      already durable and folded into it, must never regress, and a deferred page that is neither durable
      nor folded into the closure must not advance it. Recovery must gate redo on the bucket durable
      frontier, using the group checkpoint and the recycle state only as scan-start and retention aids.
      Never the A10/B20 case: a put at A10 in group A and a delete at B20 in group B compacted into one
      page whose header shows only group B at B20, with the frontier advanced for B alone, so recovery
      replays the old put and the deleted key is resurrected.
    break_consequence: >
      After a crash a reader sees a key that was deleted come back, or a key whose pages are durable is
      treated as not yet written and disappears; the same single-transaction boundary is what makes a
      crash mid-publish recoverable instead of half-visible.
    anchors:
      - src/meta/txn.rs
      - src/store/recovery.rs
      - src/meta/manifest.rs
    reproducer: remote_blob_update_from_other_group_stays_deleted_after_reopen
  - id: protocol.snapshot_candidate_traversal_complete
    title: every read of a key resolves exactly the snapshot-visible value and never leaves the key's history region
    protects: visibility
    status: active
    statement: >
      Point get, forward and reverse iteration and history traversal must reach at least one candidate
      that can satisfy the snapshot, and resolve it through one shared fallible resolver: walk versions
      newest to oldest, skip invisible ones, collect each visible merge operand, stop at the first visible
      base or tombstone or at the end of the key's history, then apply the operands once onto that base.
      The only shortcut is returning an already-visible non-merge, non-tombstone head directly.
      Old-version traversal stays inside the key's declared history region even when history pages are
      shared, the folding operator lives only in runtime state and never reaches manifest metadata, WAL
      payloads or page bytes, and the persisted kind marker is a single merge bit mutually exclusive with
      the tombstone bit. A fold that comes out empty or over the persisted size limit is a public contract
      violation on every reliable read path, never truncated, never degraded to raw operands, never a
      missing key. Never: a get that returns raw operand bytes or a stale base while an iterator returns
      the folded value, an iteration that yields a neighbouring key's older history value, or a fold error
      surfacing as a missing key. Protocol detail: `docs/design.md` 4.1, 4.2.
    break_consequence: >
      A reader sees a stale or un-folded value, a value belonging to a different key, or a missing key
      where the value exists; the persisted kind rule is the same one that keeps a merge envelope from
      decoding as a tombstone, which after a reopen would silently drop a committed value.
    anchors:
      - src/index/tree.rs
      - src/types/node.rs
      - src/types/base.rs
    reproducer: checkpointed_invisible_head_resolves_visible_history_in_both_scan_directions

  - id: protocol.ccpool_free_list_excludes_live_pins
    title: no node is ever owned by two live views at once
    protects: concurrency
    status: active
    statement: >
      A CCNode may enter a CCPool free shard or a thread's instance-local idle list only after its
      view has transitioned to Idle, and once it is there no live view can name it: each shard
      serializes pop against push, the per-thread LocalPins list is exclusive to its owning thread,
      and the pop cannot hand a node back to a caller whose pin still names it. The idle list holds
      at most LOCAL_PINS_MAX nodes, and thread exit returns them to their original shard, or leaves
      them for the core registry to reclaim while the pool is dropping. Every handoff therefore has
      an overlap - the pusher is still inside the view's refcount when the popper takes the node -
      and no interval exists in which both sides believe they own it, or neither does.
    break_consequence: >
      A data race on the node itself: one thread mutates or frees a node another is reading, so a
      view observes replaced or half-written bytes, or two writers write the same page through two
      views. The same window loses a pin, so a live reader can name a page that was already reclaimed
      - which is memory corruption and an unexplainable wrong value, not merely a lost update.
    anchors:
      - src/cc/context.rs
    reproducer: ccpool_local_never_hands_one_node_to_two_live_views
