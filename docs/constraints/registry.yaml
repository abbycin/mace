  - id: protocol.transaction_checkpoint_span_follows_group_counter
    title: max_ckpt_per_txn enforcement follows the transaction's own logical-group checkpoint counter
    kind: protocol
    status: active
    confidence: high
    statement: >
      A transaction's checkpoint-span limit is measured against the checkpoint counter of its
      own logical group. Shared Logging tracks Begin/Update/Commit/Abort activity independently
      for each group. A publish round may append one physical checkpoint record, but advances a
      group's counter exactly once only when that group had WAL activity since its prior publish;
      unrelated-group activity cannot age it. A disabled or no-activity publish ages no group.
      Relaxed per-group loggers keep their single own-group counter and the same activity rule.
    watch_points:
      - path: src/cc/log.rs
        note: logical_wal_dirty and ckpt_cnts implement per-group activity-triggered aging
      - path: src/cc/context.rs
        note: durable wiring passes every group's counter to the shared logger; relaxed wiring passes one counter per logger
      - path: src/index/txn.rs
        note: should_abort reads the transaction's own group counter against the begin-time snapshot
      - path: src/map/adapter.rs
        note: checkpoint publish calls update_checkpoint_for for every group each round
    witnesses:
      - path: src/cc/log.rs
        note: record methods mark only their logical group dirty; update_checkpoint_for clears and advances only that group's counter
      - path: src/cc/context.rs
        note: the durable shared logger is constructed with the full ckpt_cnts vec; WriterGroup keeps its own counter Arc
      - path: tests/gc.rs
        note: durable_group1_transaction_enforces_max_ckpt_per_txn proves group 1 ages; unrelated_group_checkpoints_do_not_age_group1_transaction proves group 0-only rounds do not age it
    failure_symptoms:
      - a transaction on logical group 1..N keeps committing past max_ckpt_per_txn and pins MVCC history and WAL
      - group 1..N checkpoint counters never advance while group 0's does
      - a group with WAL activity fails to age during its logical publish because it reuses a shared physical checkpoint hint
      - group 0-only checkpoint activity prematurely aborts a quiet group 1 transaction
    verifiers:
      - type: regression-test
        path: tests/gc.rs
        note: durable_group1_transaction_enforces_max_ckpt_per_txn (group 1, durable, limit 1)
      - type: regression-test
        path: tests/gc.rs
        note: unrelated_group_checkpoints_do_not_age_group1_transaction
      - type: regression-test
        path: tests/gc.rs
        note: abort_txn (group 0 path unchanged)
      - type: unit-test
        path: src/cc/log.rs
        note: shared_checkpoint_ages_only_logical_groups_with_wal_activity and update_checkpoint_advances_after_checkpoint_is_enabled
