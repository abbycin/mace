  - id: protocol.wal_recycle_state_bootstrap_completion
    title: durable wal recycle intent and done state must complete before bootstrap scanning
    kind: protocol
    status: active
    confidence: high
    statement: >
      Durable WAL recycle state in `wrc_*` is the startup source of truth for recycle progress.
      Recovery must complete any durable pending recycle intent before WAL bootstrap scanning, and
      `Done` state must remain durable enough to serve as the retained frontier when earlier WAL
      files have already been removed. The retained scan of a stream starts at its durable
      `Done` boundary. Checkpoint discovery starts at that retained boundary, and analyze may
      start later at the latest validated checkpoint hint, clamped not to precede `Done`; the
      bucket durable frontier remains the redo correctness gate. The era wipe advances every
      physical stream's `Done` state to the
      new era start (even streams with no files at the wipe time), so a stream that has files
      always boots with `Done` equal to its oldest present file and a missing file at or above
      that boundary is a real gap, never a stale-boundary artifact. Physical removal enumerates
      actual matching directory entries in the intent range, so empty or sparse streams do not
      perform work proportional to the global high-water id. The reserved shared-stream
      slot `wrc_255` (Options::SHARED_ID,
      above MAX_CONCURRENT_WRITE) carries the durable shared stream's recycle progress: the key is
      additive (a fresh key is `none` for old databases, and old code never enumerates slot 255),
      so group_wal_x cleanup needs no manifest migration.
    watch_points:
      - path: src/meta/manifest.rs
        note: wal recycle state load and commit operations live here
      - path: src/io/unix.rs
        note: unix read/open flag mapping for bootstrap WAL enumeration follow-up opens lives here
      - path: src/io/win.rs
        note: windows read/open flag mapping for bootstrap WAL enumeration follow-up opens lives here
      - path: src/store/recovery.rs
        note: recovery completes recycle intent before bootstrap scan; checkpoint discovery starts at Done and the validated hint becomes analyze's scan_start; remove_wal_prefix enumerates actual namespace entries instead of numeric ids
      - path: src/store/gc.rs
        note: runtime recycle creates intent and done state here; the durable shared stream recycles via `wrc_255` (aggregate boundary), and relaxed mode recycles per-group streams only (leftover group_wal files cannot exist in a relaxed open, since a route switch wipes every physical stream of the previous era, including the shared SHARED_ID stream, re-executed by finish_pending_wal_recycle on a mid-wipe crash)
      - path: src/utils/options.rs
        note: explicit log-dir sync helper used by recycle closure remains here; physical_wal_path maps slot 255 to the group_wal_<seq> namespace
      - path: src/io/mod.rs
        note: recycle bootstrap file enumeration and physical delete semantics now route through the filesystem boundary here
      - path: tests/prod_recovery_failpoints.rs
        note: crash windows around intent and done state persistence live here
      - path: src/store/gc.rs
        note: WalRecycleIntent.group_id is interpreted as the physical stream id; durable mode issues one intent for the shared stream (slot 255), relaxed mode issues per-group intents
    witnesses:
      - path: src/meta/manifest.rs
        note: load_wal_recycle_state and commit_wal_recycle_intent/done carry durable Sequences state; slot 255 loads as none on legacy databases
      - path: src/store/recovery.rs
        note: recovery uses durable recycle state during bootstrap and later recycle completion; load_physical_stream_boot clamps scan_start to Done and phase2 passes it to analyze
      - path: tests/prod_recovery_failpoints.rs
        note: done-frontier crash windows assert durable recycle bootstrap behavior across reopens
      - path: tests/gc_shared_wal.rs
        note: shared-stream recycle crash tests exercise the `wrc_255` intent/done windows
      - path: src/store/recovery.rs
        note: remove_wal_prefix_enumerates_present_files_instead_of_sparse_ids proves probe count follows matching entries, not a million-id range
    failure_symptoms:
      - recovery starts scanning from a frontier that assumes recycle completed when it did not
      - restart loses durable recycle progress and reopens with an invalid oldest retained wal boundary
      - done frontier is not durable enough to protect later boots after earlier wal files are removed
      - layout migration startup time grows with concurrent_write multiplied by a sparse global file id
    verifiers:
