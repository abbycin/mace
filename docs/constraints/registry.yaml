  - id: protocol.wal_recycle_safe_boundary
    title: WAL recycling must stay behind active txn, checkpoint, and pending abort-clean boundaries
    kind: protocol
    status: active
    confidence: high
    statement: >
      WAL recycling must not delete files beyond the safe boundary defined by the minimum of the
      active-txn boundary and the last durable checkpoint boundary, and it must also remain below any
      file still pinned by pending abort-clean tasks or the durable recycle frontier state. A modified
      abort must publish its pending abort-clean task before releasing the group Logging mutex that
      prevents collector maintenance from clearing the active-transaction WAL pin; the two pins must
      overlap without an unprotected handoff window.
      The durable recycle boundary is monotonic: a runtime logger carrying a pre-switch oldest id
      must clamp its intent start to the persisted done boundary, and an empty clamped range must not
      replace that done state. Otherwise a route-switch wipe can be undone by a later empty GC pass,
      making the next boot treat the deleted old-era prefix as a real WAL gap. The clamp and intent
      write are one metadata transaction; an active intent exclusively owns its physical stream and
      only a matching done transition may advance it, so concurrent shutdown fallback and GC paths
      cannot overwrite each other's recycle boundary.
      Once a route-switch wipe commits its done boundary, recovery must refresh every affected
      runtime logger's oldest-id cache before runtime GC is enabled.
      Per-logical-group shared-stream floor slots are two-state: a slot is inactive
      (Position::MAX) until the group's first update activates it at that transaction's begin LSN
      in the same logging-mutex critical section as the append, and a checkpoint publish can only
      advance an active slot (a MAX position never activates one). Recovery publishes the slots from
      retained shared-stream update evidence after analyze/redo/abort-clean and before runtime
      checkpoint/GC starts; an era wipe deactivates every slot afterwards. Inactive slots never
      participate in the recycle min, so a logical group that never wrote cannot pin the shared
      stream at file 0. If every slot and runtime pin is inactive, GC recycles complete files up
      to the current append file id and retains that current file as the finite recovery anchor;
      control-only WAL from unmodified transactions therefore cannot grow without bound.
      In relaxed mode, GC may read active-fact bounds under the group Logging mutex, then read
      pending abort-clean pins after releasing it: a modified abort completed before the first
      lock has already published its task pin in that same mutex critical section, while one not
      yet completed remains protected by its active-fact begin pin, whose file id is no later than
      the task pin it will transfer to.
    watch_points:
      - path: src/meta/manifest.rs
        note: single-bucket transactions atomically normalize intent starts and require a matching intent to commit done; global frontier lower bound also lives here
      - path: src/io/unix.rs
        note: unix read/open flag mapping for retained WAL scan and recycle-open paths lives here
      - path: src/io/win.rs
        note: windows read/open flag mapping for retained WAL scan and recycle-open paths lives here
      - path: src/utils/options.rs
        note: explicit log-dir sync helper used after recycle file removal lives here
      - path: src/cc/group.rs
        note: live active facts and begin-registration state that bound wal recycle and checkpoint live here
      - path: src/map/adapter.rs
        note: checkpoint publish clamps wal checkpoints using live active facts while holding Logging here
      - path: src/store/gc.rs
        note: runtime GC derives the recycle upper bound while holding Logging and recycles WAL files here
      - path: src/index/txn.rs
        note: modified abort transfers WAL retention from the live active-fact pin to pending abort-clean here
      - path: src/store/recovery.rs
        note: startup recovery uses recycle state when earlier WAL files are already gone, refreshes logger oldest-id caches after a wipe, and rejects overflow when deriving a shared-stream bootstrap id
      - path: src/io/mod.rs
        note: recycle bootstrap and file removal now rely on centralized try_exists/read_dir/remove_file semantics here
      - path: src/cc/log.rs
        note: shared stream keeps per-logical-group checkpoint floors; recycle cut is the min over all groups' floors and pins
      - path: src/store/gc.rs
        note: the durable shared stream recycles via one aggregate intent; when every floor and pin is inactive, current_pos.file_id is the finite cut
      - path: src/store/recovery.rs
        note: analyze collects logical groups with retained shared-stream updates; phase2 publishes inactive (MAX) slots for the rest or deactivates every slot after an era wipe
      - path: src/cc/log.rs
        note: record_update activates an inactive slot at the first update's begin LSN under the logging mutex; update_checkpoint_for rejects a MAX position so a slot never deactivates
    witnesses:
      - path: src/meta/manifest.rs
        note: commit_wal_recycle_intent atomically clamps stale starts and owns the stream through commit_wal_recycle_done; global frontier lower bound includes active buckets with pending flush and fallback checkpoints
      - path: src/cc/group.rs
        note: live active facts remain the source of truth for current active wal file and lsn bounds
      - path: src/map/adapter.rs
        note: checkpoint publish uses live active lsn bounds while holding Logging before updating wal checkpoints
      - path: src/store/gc.rs
